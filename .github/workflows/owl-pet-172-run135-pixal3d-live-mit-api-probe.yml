name: owl172 Run135 no-cost Pixal3D live API and rights probe no release
on:
  push:
    branches:
      - research/owl172-run135-pixal3d-mit-live-api-feasibility
    paths:
      - .github/workflows/owl-pet-172-run135-pixal3d-live-mit-api-probe.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run135_pixal3d_live_mit_feasibility.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alternative-provider-live-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run135-pixal3d-mit-live-api-feasibility
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run117-FREE-TRELLIS-QUOTA-RECHECK-ART_REJECTED/rightmost_baby_owl_512_rgba.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run135_pixal3d_live_mit_feasibility.py
            .github/workflows/owl-pet-172-run135-pixal3d-live-mit-api-probe.yml
      - name: Call the live free Gradio service for schema without using GPU
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run135-PIXAL3D-MIT-LIVE-ACTUAL-PROBE-NO_RELEASE"
          mkdir -p "$O"
          python3 -m py_compile "$R/tools/run135_pixal3d_live_mit_feasibility.py"
          python3 -m pip install -q --break-system-packages 'Pillow>=10.3' 'gradio_client==1.14.0'
          python3 "$R/tools/run135_pixal3d_live_mit_feasibility.py" 2>&1 | tee "$O/run135_actual_live_probe.log"
          test -s "$O/run135_status.json"
      - name: Independent evidence SHA256 verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run135-PIXAL3D-MIT-LIVE-ACTUAL-PROBE-NO_RELEASE
          mkdir -p "$O"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O" && sha256sum -c SHA256SUMS.txt > checksum_verification.log)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run135-no-fee-live-alternative-schema-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run135-PIXAL3D-MIT-LIVE-ACTUAL-PROBE-NO_RELEASE
          retention-days: 30
      - name: Commit only experiment evidence (not any production asset)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run135-PIXAL3D-MIT-LIVE-ACTUAL-PROBE-NO_RELEASE
          git add --sparse "$O"
          git diff --cached --name-only >/tmp/owl134_paths
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run135-' /tmp/owl134_paths; then exit 9; fi
          if ! git diff --cached --quiet; then
            git commit -m 'research(owl172): archive actual Pixal3D free API/rights probe evidence'
            git push origin HEAD:research/owl172-run135-pixal3d-mit-live-api-feasibility
          fi
