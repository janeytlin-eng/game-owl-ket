name: owl172 Run198 Hyper3D free actual image to native GLB NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run198-hyper3d-real-free-image-mesh
    paths:
      - .github/workflows/owl-pet-172-run198-hyper3d-real-free-native-no-release.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run198_hyper3d_free_browser_native.py
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run198_seven_camera_native.py
permissions:
  contents: write
jobs:
  actual-free-native-image3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run198-hyper3d-real-free-image-mesh
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-19-run196-run197-real-threejs-skinned-lod-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run198_hyper3d_free_browser_native.py
            owl-pet/3d-experiments/172-tyto-castanops/tools/run198_seven_camera_native.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact reference and design/rejected registry; no production modifications
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run198-HYPER3D-REAL-NATIVE-NO_RELEASE"
          mkdir -p "$O"
          for p in owl-pet/AGENTS.md owl-pet/README.md owl-pet/prototype/index.html owl-pet/research/species/172-tyto-castanops-v3.md "$R/known_rejected_asset_sha256_registry.json" "$R/2026-11-19-run196-run197-real-threejs-skinned-lod-ART_REJECTED-NO_RELEASE.md"; do
            test -s "$p"
            sha256sum "$p" >> "$O/preflight_read_sha256.txt"
          done
          sha256sum "$R/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png" | tee "$O/reference_sha256.txt"
          grep -q '^5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9 ' "$O/reference_sha256.txt"
          python -m py_compile "$R/tools/run198_hyper3d_free_browser_native.py" "$R/tools/run198_seven_camera_native.py"
      - name: Install public free Chromium and glTF inspection tools
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run198-HYPER3D-REAL-NATIVE-NO_RELEASE
          python -m pip install -q playwright==1.56.0 trimesh==4.10.0 numpy==2.2.6 pillow==12.0.0 > "$O/pip_install.log" 2>&1
          python -m playwright install chromium > "$O/browser_install.log" 2>&1
      - name: Actual no-charge browser upload and one generator attempt without security challenge bypass
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run198-HYPER3D-REAL-NATIVE-NO_RELEASE"
          timeout 345s python -u "$R/tools/run198_hyper3d_free_browser_native.py" 2>&1 | tee "$O/actual_browser_attempt.log"
      - name: Render genuine new GLB only, via native VTK seven-camera import
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run198-HYPER3D-REAL-NATIVE-NO_RELEASE"
          if [ -s "$O/run198_NEW_UNREVIEWED_NATIVE.glb" ]; then
            sudo apt-get update -qq > "$O/apt_update.log" 2>&1
            sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 > "$O/apt_mesa.log" 2>&1
            python -m pip install -q vtk==9.6.2 > "$O/pip_vtk.log" 2>&1
            VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow timeout 170s python -u "$R/tools/run198_seven_camera_native.py" 2>&1 | tee "$O/actual_native_render.log"
          else
            printf 'SKIPPED: no verified new native GLB; never render a substitute\n' | tee "$O/actual_native_render.log"
          fi
      - name: Strict no-release, data-bound scientific caveats, evidence hashes and audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, datetime
          r=Path("owl-pet/3d-experiments/172-tyto-castanops")
          o=r/"research-evidence-run198-HYPER3D-REAL-NATIVE-NO_RELEASE"
          o.mkdir(parents=True,exist_ok=True)
          (o/"NO_RELEASE.flag").write_text("UNREVIEWED OR REJECTED ART: no published target, no physical mobile GPU, no paid calls\n")
          p=o/"run198_result.json"
          d=json.loads(p.read_text()) if p.exists() else {"result":"NO_MACHINE_RESULT","new_valid_glb":False}
          nv=o/"run198_native_sevenview.json"
          n=json.loads(nv.read_text()) if nv.exists() else {"rendered_actual_GLTF":False}
          lines=[
            "# Run198 — real browser zero-charge original-image-to-native experiment (NO_RELEASE)",
            "",
            "**Status: "+str(d.get("result"))+" / NEW_NATIVE="+str(d.get("new_valid_glb"))+" / NATIVE_VIEWS="+str(n.get("rendered_actual_GLTF"))+" / ART_UNREVIEWED / NO_RELEASE.**",
            "",
            "UTC recorded: "+datetime.datetime.now(datetime.timezone.utc).isoformat()+".",
            "Preflight read: owl-pet README, AGENTS, existing cat WebGL prototype, Tyto castanops v3 taxon and age-unknown cream mesoptile design boundary, Run196-197 technical QA and known rejected source hash registry.",
            "Exact image reference SHA256: 5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9.",
            "New, previously untested public source: https://hyper3d.site/en . Web page advertises 3 free generations/hour, no account, GLB export and automatic Cloudflare Turnstile. This claim is only marketing until the actual browser returns a valid source-bound file. No bypass of challenge, no payment or account access.",
            "Real source browser result: "+json.dumps({"http":d.get("initial_http_status"),"upload":d.get("upload"),"actual_submit":d.get("submission"),"result":d.get("result"),"candidate_count":len(d.get("binary_candidates",[])),"errors":d.get("errors",[])[:3]},ensure_ascii=False)+".",
            "Native VTK importer seven-camera result, if new valid GLB existed: "+json.dumps({"rendered":n.get("rendered_actual_GLTF"),"views":n.get("views",[]),"error":n.get("exception",n.get("skip",""))},ensure_ascii=False)+".",
            "All original screenshots, responses, new unreviewed source-bound GLB if obtained, seven actual native views if rendered, and cryptographic evidence are in a quarantined GitHub Actions artifact. No candidate is silently accepted or reused as the product.",
            "Quality gates not waived: authentic young Tyto rounded proportions, natural creamy-white thick soft second-down, continuous heart-shaped facial disc, dark eyes, down-buried short wings, fully concealed tail, broad tree-hollow support, consistent side and rear profile, materials and animations, legally usable source, physical phone WebGL compatibility/performance. Exact week age and scientific verification are not claimed.",
            "No deployment, main edit, existing prototype change or 251-species workflow impact. Extra spend: USD 0.",
            "",
            "**NO_RELEASE.**"
          ]
          audit=r/"2026-11-19-run198-hyper3d-actual-free-browser-native-NO_RELEASE.md"
          audit.write_text("\n".join(lines)+"\n")
          mf={str(p.relative_to(o)):{"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(o.rglob("*")) if p.is_file() and p.name!="run198_evidence_sha256.json"}
          (o/"run198_evidence_sha256.json").write_text(json.dumps(mf,indent=2)+"\n")
          assert all(hashlib.sha256((o/name).read_bytes()).hexdigest()==v["sha256"] for name,v in mf.items())
          print("VERIFIED_FILES",len(mf),"NEW_GLBS",len(list(o.glob("*NEW*.glb"))),"VERDICT",d.get("result"),"NO_RELEASE")
          PY
      - name: Quarantined real raw result/screenshots with 30-day retention
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run198-hyper3d-original-image-real-native-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run198-HYPER3D-REAL-NATIVE-NO_RELEASE/
          retention-days: 30
      - name: Commit only #172 textual evidence and audit, never unaccepted 3D or previews
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run198-HYPER3D-REAL-NATIVE-NO_RELEASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f "$R/2026-11-19-run198-hyper3d-actual-free-browser-native-NO_RELEASE.md" && git add --sparse "$R/2026-11-19-run198-hyper3d-actual-free-browser-native-NO_RELEASE.md"
          find "$O" -type f \( -name '*.json' -o -name '*.txt' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only > /tmp/owl198_changed
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/owl198_changed; then exit 80; fi
          if grep -Ei '\.(glb|fbx|blend|obj|zip|png|jpg|webp|html)$' /tmp/owl198_changed; then exit 81; fi
          if test -s /tmp/owl198_changed; then
            git commit -m "research(owl172): Run198 actual Hyper3D browser provenance audit NO_RELEASE"
            git push origin HEAD:research/owl172-run198-hyper3d-real-free-image-mesh
          fi
