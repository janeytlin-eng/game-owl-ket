name: owl172 Run175 actual free image-conditioned 3D MCP native QA NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run175-reference-bound-free-mcp-native-qa
    paths:
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run175_reference_bound_free_mcp.py
permissions:
  contents: write
jobs:
  image-to-native-GLB-actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run175-reference-bound-free-mcp-native-qa
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run169-source-calibrated-vtk-native-sixview-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run175_reference_bound_free_mcp.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare evidence and exact target image, check Python
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run175-FREE-MCP-IMAGE-BOUND-NO_RELEASE"
          mkdir -p "$O"
          echo "5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9  $R/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png" | sha256sum -c | tee "$O/preflight-sha256.txt"
          python3 -m json.tool "$R/known_rejected_asset_sha256_registry.json" >/dev/null
          python3 -m py_compile "$R/tools/run175_reference_bound_free_mcp.py"
          python -m pip install --disable-pip-version-check -q requests trimesh pillow numpy 'vtk==9.6.2' > "$O/dependencies-install.log" 2>&1
          python -c 'import requests,trimesh,numpy,PIL,vtk; print("trimesh",trimesh.__version__,"vtk",vtk.vtkVersion.GetVTKVersion())' | tee -a "$O/dependencies-install.log"
      - name: Actual one no-fee public reference image to native GLB with isolated six-axis QA
        timeout-minutes: 14
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run175-FREE-MCP-IMAGE-BOUND-NO_RELEASE"
          timeout 790s python -u "$R/tools/run175_reference_bound_free_mcp.py" 2>&1 | tee "$O/run175_execution.log"
      - name: Truthful NO_RELEASE audit plus independent evidence integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          r=Path('owl-pet/3d-experiments/172-tyto-castanops')
          o=r/'research-evidence-run175-FREE-MCP-IMAGE-BOUND-NO_RELEASE'
          o.mkdir(parents=True,exist_ok=True)
          d=json.loads((o/'run175_actual_results.json').read_text()) if (o/'run175_actual_results.json').exists() else {}
          (o/'NO_RELEASE.flag').write_text('NO_RELEASE. Native file, anatomical six-view and real phone GPU have not all been art-accepted. Zero payments.\n')
          m={p.name:{"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
             for p in sorted(o.iterdir()) if p.is_file() and p.name!='sha256_manifest.json'}
          (o/'sha256_manifest.json').write_text(json.dumps(m,indent=2))
          assert all(hashlib.sha256((o/n).read_bytes()).hexdigest()==v['sha256'] for n,v in m.items())
          s=d.get('status','NOT_EXECUTED')
          note=[
            '# Run175: image-conditioned three.ws free MCP studio native GLB experiment',
            '',
            '**NO_RELEASE / ART_NOT_ACCEPTED.** Experiment only; no product, no main branch change.',
            '',
            'Checked owl-pet README, AGENTS, WebGL prototype, v3 #172 cream mesoptile target, rejected Run169 6-view GLB and SHA registry. Exact target crop reference SHA256 is 5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9 (reverified in CI).',
            '',
            'Provider: official keyless non-crypto https://three.ws/api/mcp-studio mesh_forge(image_url, prompt), documented as a free image-to-3D tool. Attempted only one idempotency-keyed image-conditioned generation, not the text-only Run173/174 endpoint. GLB is independently inspected only if actually returned. No x402, credits, payment, account rotation, proxy or quota evasion.',
            '',
            'Observed execution status: **'+s+'**.',
            'Fresh verified GLBs: **'+str(d.get('new_glb_count',0))+'**. Native VTK rendering: **'+d.get('native_render','NOT_EXECUTED')+'**. Art and true front/side/back anatomy: **NOT ACCEPTED**. Physical phone GPU/WebGL: **NOT TESTED**.',
            'Source public image SHA verified: '+str(d.get('remote_reference_pass',False))+'. MCP tools preflight: '+str(d.get('mcp_preflight','NOT_COMPLETED'))+'. Evidence items and SHA256 manifest: '+str(len(m))+'.',
            '',
            'Only independent #172 research tool, experiment workflow, text and raster evidence committed. GLB binary (if any) stays in 30-day isolated Actions artifact. Premium soft down, juvenile anatomical forms and real mobile WebGL remain explicit release gates.',
            '',
            'No SVG/primitive geometry or rejected model substitution. No changes to 251-species production, original prototype, concept images, deployment or main. **NO_RELEASE**.'
          ]
          (r/'2026-11-18-run175-reference-bound-free-mcp-native-NO_RELEASE.md').write_text('\n'.join(note)+'\n')
          print('RUN175_AUDIT status',s,'glb',d.get('new_glb_count',0),'files',len(m))
          PY
      - name: Retain real evidence, never deploy unaccepted GLB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run175-image-bound-free-MCP-3d-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run175-FREE-MCP-IMAGE-BOUND-NO_RELEASE/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit audit only on independent research branch, not model binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run175-FREE-MCP-IMAGE-BOUND-NO_RELEASE"
          git add --sparse "$R/2026-11-18-run175-reference-bound-free-mcp-native-NO_RELEASE.md"
          find "$O" -maxdepth 1 -type f \( -name '*.json' -o -name '*.png' -o -name '*.txt' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only > /tmp/run175_staged.txt
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/run175_staged.txt; then exit 90; fi
          if grep -Ei '\.(glb|blend|zip|fbx|obj|bin)$' /tmp/run175_staged.txt; then exit 91; fi
          if [ -s /tmp/run175_staged.txt ]; then
            git commit -m 'research(owl172): archive genuine image-bound no-fee Run175 evidence NO_RELEASE'
            git push origin HEAD:research/owl172-run175-reference-bound-free-mcp-native-qa
          fi
