name: "#172 Run251 authentic neural eye PBR and volumetric posterior cut — NO_RELEASE"
on:
  push:
    branches:
      - research/owl172-run251-dark-eye-pbr-native-tail-volume-cut-no-release
    paths:
      - '.github/workflows/owl172-run251-native-neural-eye-pbr-and-tail-cut-webgl.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  real-neural-eye-and-volume-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only existing free native mesh and browser QA software
        run: |
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" "scikit-image==0.26.0" "trimesh==4.11.1" "Pillow==12.3.0"
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run251_juvenile_tail_surgery_and_eye_pbr.py
      - name: Recover previously verified true Hunyuan volumetric neural GLB by SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC=owl-pet/3d-experiments/172-tyto-castanops/run251-source
          mkdir -p "$SRC"
          gh run download 44790702174 -R janeytlin-eng/game-owl-ket -n owl172-run250-true-neural-volume-LOD-fourteenviews-RESEARCH-NO-RELEASE -D "$SRC"
          echo '0b1d83f6b62191edbff2abc037ed3d635b73549ccffeac00c0b7bef02f1af5cc  owl-pet/3d-experiments/172-tyto-castanops/run251-source/run250-evidence/run250_A_native_neural_volumetric_juvenile_rebuild_LOD_RESEARCH_NO_RELEASE.glb' | sha256sum -c -
      - name: Real eye-material control A and true volumetric posterior surgery B
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run251_juvenile_tail_surgery_and_eye_pbr.py \
            --source owl-pet/3d-experiments/172-tyto-castanops/run251-source/run250-evidence/run250_A_native_neural_volumetric_juvenile_rebuild_LOD_RESEARCH_NO_RELEASE.glb \
            --outdir owl-pet/3d-experiments/172-tyto-castanops/run251-evidence
      - name: Actual Chromium Three.js seven native 3D views for each GLB
        run: |
          set -euo pipefail
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run251-evidence
          for V in A B; do
            export OWL172_RUN_LABEL="Run251_"$V"_real_neural_3D_NO_RELEASE"
            export OWL172_QA_DIR="$PWD/$EVID/browser_$V"
            export OWL172_GLB_INPUT="$PWD/$EVID/run251_"$V"_authentic_neural_owl_eye_repair_tail_surgery_NO_RELEASE.glb"
            export OWL172_EXPECTED_SHA="$(python -c "import json; a=json.load(open('$EVID/run251_geometry_report.json'));print(a['variants']['$V']['sha256'])")"
            mkdir -p "$OWL172_QA_DIR"
            xvfb-run -a timeout 340s node owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs
          done
      - name: Independently verify screenshots and create actual fourteen-view control
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import hashlib,json
          root=Path('owl-pet/3d-experiments/172-tyto-castanops/run251-evidence')
          root.mkdir(exist_ok=True,parents=True)
          cameras=['front','left','threequarter','right','back','top','bottom']
          report={'run':'Run251','art_approved':False,'phone_gpu':'UNTESTED','release':'NO_RELEASE','variants':{}}
          frames=[]
          for v in 'AB':
              folder=root/('browser_'+v)
              rp=folder/'run237_machine_report.json'
              if not rp.exists():
                  report['variants'][v]={'status':'MISSING_REPORT'}
                  continue
              r=json.loads(rp.read_text())
              report['variants'][v]={'status':r.get('status'),'gates':r.get('gates'),
                                      'driver':r.get('browser',{}).get('renderer',{})}
              for view in cameras:
                  p=folder/('run237_'+view+'_WEBGL_RESEARCH_NOT_APPROVED.png')
                  m=[q for q in r.get('views',[]) if q.get('name')==view]
                  assert p.exists() and len(m)==1,(v,view)
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==m[0]['screenshot']['sha256']
                  frames.append((v,view,Image.open(p).convert('RGB')))
          if len(frames)==14:
              image=Image.new('RGB',(1380,1480),(235,238,241))
              drawer=ImageDraw.Draw(image)
              for i,(v,view,frame) in enumerate(frames):
                  x=(i%4)*345;y=(i//4)*370
                  image.paste(frame.resize((337,337)),(x+3,y+29))
                  drawer.text((x+5,y+8),'Run251 '+v+' '+view+' NO_RELEASE',fill=(16,16,16))
              target=root/'run251_AB_14_ACTUAL_BROWSER_VIEWS_UNAPPROVED.png'
              image.save(target)
              report['contact_sha256']=hashlib.sha256(target.read_bytes()).hexdigest()
          (root/'run251_webgl_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run251-neural-ocular-PBR-posterior-volume-AB-14views-NO_RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run251-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run251_juvenile_tail_surgery_and_eye_pbr.py
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve only dedicated research reports and real-browser art contact
        if: always()
        run: |
          git config user.name owl172-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run251-evidence
          git add -f "$EVID"/*.json 2>/dev/null || true
          git add -f "$EVID"/run251_AB_14_ACTUAL_BROWSER_VIEWS_UNAPPROVED.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "audit(owl172): Run251 genuine black pupil correction and actual GLB WebGL2 evidence NO_RELEASE"
            git pull --rebase origin research/owl172-run251-dark-eye-pbr-native-tail-volume-cut-no-release
            git push origin HEAD:research/owl172-run251-dark-eye-pbr-native-tail-volume-cut-no-release
          fi
