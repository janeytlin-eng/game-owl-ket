name: owl172 Run264 isolated authentic native sculpt and five-angle art reject QA NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run264-embedded-eye-dense-down-geometry-negative-control-NO_RELEASE
    paths:
      - .github/workflows/owl172-run264-native-socket-dense-down-REJECTED.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run264_native_anatomy_test.py
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run264_vtk_real_views.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  run264-private-native-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run264-embedded-eye-dense-down-geometry-negative-control-NO_RELEASE
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops/tools/run264_native_anatomy_test.py
            owl-pet/3d-experiments/172-tyto-castanops/tools/run264_vtk_real_views.py
            owl-pet/3d-experiments/172-tyto-castanops/run256_actual_browser_7view_qa.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run256_real_threejs_viewer_RESEARCH_NO_RELEASE.html
      - uses: actions/download-artifact@v4
        with:
          name: owl172-run263-authentic-native-eye-microdown-rejected-NO_RELEASE
          run-id: 44877794915
          github-token: ${{ github.token }}
          path: /tmp/run263-original
      - name: Actually reconstruct from verified original neural mesh, no free-provider calls
        shell: bash
        timeout-minutes: 10
        id: sculpt
        continue-on-error: true
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-run264-NATIVE-REJECTED-NO_RELEASE"
          mkdir -p "$O"
          cp /tmp/run263-original/run263_verified_source_RESEARCH_ONLY.glb "$O/"
          cp /tmp/run263-original/run263_RESEARCH_NATIVE_ART_REJECTED_NO_RELEASE.glb "$O/"
          test "$(sha256sum "$O/run263_verified_source_RESEARCH_ONLY.glb" | cut -d' ' -f1)" = e3c33c70a8a1136a7548d22d2a272e9c5c254e773959b7705d5261ed0fec4535
          python3 -m pip install --no-cache-dir --break-system-packages numpy scipy trimesh pillow vtk
          python3 "$R/tools/run264_native_anatomy_test.py" "$O/run263_verified_source_RESEARCH_ONLY.glb" "$O" 2>&1 | tee "$O/run264_sculpt.log"
          python3 - <<'PY'
          import json,pathlib
          o=pathlib.Path('owl-pet/3d-experiments/172-tyto-castanops/research-run264-NATIVE-REJECTED-NO_RELEASE')
          d=json.loads((o/'run264_machine_report.json').read_text())
          assert d['mesh_count']==4 and d['body_watertight'] and d['body_faces_preserved']
          assert d['triangle_count']>70000 and d['release']=='NO_RELEASE'
          PY
      - name: Actually render ten genuine 3D spatial VTK angles for art inspection
        shell: bash
        if: always()
        continue-on-error: true
        timeout-minutes: 9
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-run264-NATIVE-REJECTED-NO_RELEASE"
          [ -s "$O/run264_native_juvenile_socket_compaction_DOWN_REJECTED_NO_RELEASE.glb" ] || { echo NO_NATIVE_GLB_SKIP_VTK; exit 0; }
          xvfb-run -a timeout 450s python3 "$R/tools/run264_vtk_real_views.py" "$O" 2>&1 | tee "$O/run264_actual_VTK_10view.log"
      - name: Actual Three.js GLTFLoader Chromium WebGL2 seven-angle native geometry QA
        shell: bash
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-run264-NATIVE-REJECTED-NO_RELEASE"
          MODEL="$O/run264_native_juvenile_socket_compaction_DOWN_REJECTED_NO_RELEASE.glb"
          [ -s "$MODEL" ] || { echo NO_NATIVE_GLB_SKIP_BROWSER; exit 0; }
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          export OWL172_RUN_LABEL=run264_ART_REJECTED
          export OWL172_GLB_INPUT="$PWD/$MODEL"
          export OWL172_QA_DIR="$PWD/$O/chromium_real_webgl2"
          export OWL172_EXPECTED_SHA="$(sha256sum "$MODEL" | cut -d' ' -f1)"
          mkdir -p "$OWL172_QA_DIR"
          xvfb-run -a timeout 480s node "$R/run256_actual_browser_7view_qa.mjs" 2>&1 | tee "$O/run264_actual_threejs_7view.log"
      - name: Always archive original evidence and explicit refusal
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-run264-NATIVE-REJECTED-NO_RELEASE
          mkdir -p "$O"
          echo 'ART_REJECTED; PHONE_UNTESTED; RIGHTS_UNCLEARED; NO_RELEASE' > "$O/NO_RELEASE.flag"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O" && sha256sum -c SHA256SUMS.txt > checksum_verification.log)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run264-authentic-3d-socket-down-ART_REJECTED-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-run264-NATIVE-REJECTED-NO_RELEASE
          retention-days: 30
