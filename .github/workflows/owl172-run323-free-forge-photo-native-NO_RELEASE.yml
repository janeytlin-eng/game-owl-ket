name: "Owl172 Run323 actual free Forge photo-to-3D UI NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run323-forge-free-UI-native-juvenile-qa-NO_RELEASE
    paths:
      - .github/workflows/owl172-run323-free-forge-photo-native-NO_RELEASE.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-free-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/design/concepts/172-tyto-castanops-v3.png
            owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run323_actual_public_free_forge_chick_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run322_native_orbit_chromium_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run322_native_orbit_research_NO_RELEASE.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild exact original #172 v3 rightmost cream chick input
        run: |
          set -euo pipefail
          python -m pip install -q opencv-python-headless numpy pillow trimesh requests
          node --check owl-pet/3d-experiments/172-tyto-castanops/run323_actual_public_free_forge_chick_NO_RELEASE.mjs
          python owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py > run323-source-qa.log
          python - <<'PY'
          import hashlib
          p='owl172-run295-evidence/young-isolated-white-background-input-NO_3D.png'
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()=='6ec346e5b02411f9509fd364db748c23a58075aeec461ef7424adcc4d893bc77'
          print('Exact original v3 target SOURCE_PASS')
          PY
      - name: Install free browser and glTF viewer
        run: |
          npm install --no-audit --no-fund --no-save playwright-core@1.58.2 three@0.170.0 pngjs@7.0.0
      - name: Actual normal free browser operation without payment, captcha, or sign-in bypass
        run: |
          CHROME_BIN=/usr/bin/google-chrome node owl-pet/3d-experiments/172-tyto-castanops/run323_actual_public_free_forge_chick_NO_RELEASE.mjs | tee owl172-run323-browser-stdout.log
      - name: Independently parse native GLB and render WebGL2 only if actually downloaded
        run: |
          set -euo pipefail
          M=owl172-run323-evidence/run323-public-free-NATIVE-RESEARCH-ART_UNAPPROVED.glb
          if test -f "$M"; then
            python - <<'PY'
          import trimesh,hashlib,json
          from pathlib import Path
          p=Path('owl172-run323-evidence/run323-public-free-NATIVE-RESEARCH-ART_UNAPPROVED.glb')
          scene=trimesh.load(p,force='scene',process=False)
          meshes=list(scene.geometry.values())
          faces=sum(len(m.faces) for m in meshes)
          if faces<1000:raise RuntimeError('Insufficient real native mesh geometry')
          r=dict(bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
             meshes=len(meshes),triangles=faces,UV=sum(int(getattr(m.visual,'uv',None)is not None) for m in meshes),
             rights='HOLD',art='UNASSESSED',phone='UNTESTED',release=False)
          (p.parent/'native-geometry-report.json').write_text(json.dumps(r,indent=2))
          print(json.dumps(r))
          PY
            CHROME_BIN=/usr/bin/google-chrome node owl-pet/3d-experiments/172-tyto-castanops/run322_native_orbit_chromium_NO_RELEASE.mjs "$M" owl172-run323-evidence/webgl2 | tee owl172-run323-evidence/actual-WebGL2-log.txt
          else
            echo "NO_REAL_NATIVE_GLB: skipping native mesh and WebGL2; NOT an art release"
          fi
      - name: Persist observed blocker or real 3D evidence on separate research branch only
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageDraw
          p=Path('owl172-run323-evidence');p.mkdir(exist_ok=True)
          pics=sorted((p/'webgl2').glob('yaw_*.png'))
          if pics:
            sheet=Image.new('RGB',(920,980),(236,231,223));d=ImageDraw.Draw(sheet)
            for i,f in enumerate(pics[:8]):
              im=Image.open(f).convert('RGB').resize((230,460));x=i%4*230;y=i//4*490
              sheet.paste(im,(x,y+20));d.text((x+8,y+5),f.stem,fill=(20,20,20))
            sheet.save(p/'run323-8-spatial-views-ART_UNAPPROVED.jpg',quality=87,optimize=True)
          r={'run':323,'release':False,'art_approved':False,'physical_phone':'UNTESTED',
             'rights_cleared':False,'all251_production_untouched':True,'extra_paid_usd':0,
             'actual_browser_views':len(pics),
             'actual_native_glb':(p/'run323-public-free-NATIVE-RESEARCH-ART_UNAPPROVED.glb').exists()}
          (p/'run323-final-state.json').write_text(json.dumps(r,indent=2))
          (p/'STRICT_NO_RELEASE.txt').write_text('Run323 research-only. Art, phone, rights NOT APPROVED. Do not distribute as a usable owl pet.\n')
          files=[f for f in sorted(p.rglob('*')) if f.is_file() and f.name not in ('SHA256SUMS.txt','file_hashes.json')]
          hashes=[dict(path=str(f.relative_to(p)),sha256=hashlib.sha256(f.read_bytes()).hexdigest(),bytes=f.stat().st_size) for f in files]
          (p/'file_hashes.json').write_text(json.dumps(hashes,indent=2))
          (p/'SHA256SUMS.txt').write_text('\n'.join(x['sha256']+'  '+x['path'] for x in hashes)+'\n')
          print(r,'evidence files',len(hashes))
          PY
          (cd owl172-run323-evidence && sha256sum -c SHA256SUMS.txt)
          DEST=owl-pet/3d-experiments/172-tyto-castanops/run323-live-evidence
          mkdir -p "$DEST"
          cp owl172-run323-evidence/run323-browser-report.json "$DEST/" 2>/dev/null || true
          cp owl172-run323-evidence/run323-final-state.json "$DEST/" 2>/dev/null || true
          cp owl172-run323-evidence/file_hashes.json "$DEST/" 2>/dev/null || true
          cp owl172-run323-evidence/run323-8-spatial-views-ART_UNAPPROVED.jpg "$DEST/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "research(#172): persist actual Run323 blocker/model evidence, NO_RELEASE"
            git push origin "HEAD:research/owl172-run323-forge-free-UI-native-juvenile-qa-NO_RELEASE"
          fi
      - name: Preserve real run evidence temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run323-actual-free-Forge-juvenile-NO_RELEASE
          path: |
            owl172-run323-evidence/
            owl172-run323-browser-stdout.log
            run323-source-qa.log
          retention-days: 14
          if-no-files-found: warn

# Run323b corrected provenance: unrelated site robot demo GLB must not pass model gate.
