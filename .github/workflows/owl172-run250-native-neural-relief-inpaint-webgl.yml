name: "#172 Run250 genuine neural wing relief inpainting — NO_RELEASE"
on:
  push:
    branches:
      - research/owl172-run250-laplacian-wing-relief-inpainting-art-reject-no-release
    paths:
      - '.github/workflows/owl172-run250-native-neural-relief-inpaint-webgl.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  real-neural-relief-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free mesh solvers and WebGL tools
        run: |
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "trimesh==4.9.0" "Pillow==10.4.0"
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run250_surface_inpaint.py
      - name: Recover verified native neural core from previous source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=owl-pet/3d-experiments/172-tyto-castanops/run250-source
          mkdir -p "$SRC"
          gh run download 44763474018 -R janeytlin-eng/game-owl-ket -n owl172-run248-true-neural-anatomy-AB-fourteenview-RESEARCH-NO-RELEASE -D "$SRC"
          echo '247d820538920735783072a204686fcf2f02ddb3ce1958a5472895a3ed7c1845  owl-pet/3d-experiments/172-tyto-castanops/run250-source/run248-evidence/run248_A_true_neural_juvenile_selective_wing_sculpt_RESEARCH_NO_RELEASE.glb' | sha256sum -c -
      - name: Construct inpainted real native 3D variants with topology quality guard
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run250_surface_inpaint.py --source owl-pet/3d-experiments/172-tyto-castanops/run250-source/run248-evidence/run248_A_true_neural_juvenile_selective_wing_sculpt_RESEARCH_NO_RELEASE.glb --outdir owl-pet/3d-experiments/172-tyto-castanops/run250-evidence
      - name: Seven true Three.js camera positions for each actual GLB
        run: |
          set -euo pipefail
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run250-evidence
          for V in A B; do
            export OWL172_RUN_LABEL="Run250_$V_real_mesh_RESEARCH_ONLY"
            export OWL172_QA_DIR="$PWD/$EVID/browser_$V"
            export OWL172_GLB_INPUT="$PWD/$EVID/run250_"$V"_genuine_neural_wing_surface_inpaint_NO_RELEASE.glb"
            export OWL172_EXPECTED_SHA="$(python -c "import json; j=json.load(open('$EVID/run250_geometry_report.json')); print(j['variants']['$V']['sha256'])")"
            mkdir -p "$OWL172_QA_DIR"
            xvfb-run -a timeout 340s node owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs
          done
      - name: Independently check screenshot SHA and contact sheet
        if: always()
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageDraw
          base=Path('owl-pet/3d-experiments/172-tyto-castanops/run250-evidence')
          base.mkdir(parents=True,exist_ok=True)
          names=['front','left','threequarter','right','back','top','bottom']
          allviews=[];summary={'run':'Run250','release':'NO_RELEASE','phone_gpu':'UNTESTED','art_approved':False,'variants':{}}
          for v in 'AB':
              rep=base/('browser_'+v)/'run237_machine_report.json'
              if not rep.exists():summary['variants'][v]={'status':'MISSING'};continue
              d=json.loads(rep.read_text())
              summary['variants'][v]={'status':d.get('status'),'gates':d.get('gates'),'driver':d.get('browser',{}).get('renderer',{})}
              for name in names:
                  p=rep.parent/f'run237_{name}_WEBGL_RESEARCH_NOT_APPROVED.png'
                  match=[x for x in d.get('views',[]) if x.get('name')==name]
                  assert p.is_file() and len(match)==1
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==match[0]['screenshot']['sha256']
                  allviews.append((v,name,Image.open(p).convert('RGB')))
          if len(allviews)==14:
              sheet=Image.new('RGB',(1380,1480),(234,237,241));draw=ImageDraw.Draw(sheet)
              for i,(v,n,im) in enumerate(allviews):
                  x=(i%4)*345;y=(i//4)*370
                  sheet.paste(im.resize((337,337)),(x+3,y+29))
                  draw.text((x+5,y+8),f'Run250 {v} {n} NOT APPROVED',fill=(20,20,20))
              p=base/'run250_AB_14_TRUE_WEBGL2_VIEWS_ART_UNAPPROVED.png';sheet.save(p)
              summary['contact_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          (base/'run250_webgl_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run250-neural-inpaint-AB-14view-ART_REJECTED-NO_RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run250-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run250_surface_inpaint.py
          retention-days: 30
          if-no-files-found: warn
      - name: Persist independent research machine reports and real browser contact only
        if: always()
        run: |
          git config user.name owl172-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run250-evidence
          git add -f "$EVID"/*.json 2>/dev/null || true
          git add -f "$EVID"/run250_AB_14_TRUE_WEBGL2_VIEWS_ART_UNAPPROVED.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "audit(owl172): Run250 native neural inpaint independent WebGL2 evidence NO_RELEASE"
            git pull --rebase origin research/owl172-run250-laplacian-wing-relief-inpainting-art-reject-no-release
            git push origin HEAD:research/owl172-run250-laplacian-wing-relief-inpainting-art-reject-no-release
          fi
