name: owl172 Run200 new zero-fee original-image native generator and free sculpt license gate
on:
  push:
    branches:
      - research/owl172-run200-new-free-image-mesh-source
    paths:
      - .github/workflows/owl-pet-172-run200-free-image-mesh-source.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run200_free_new_providers_native_qa.py
permissions:
  contents: write
jobs:
  original-target-native-zero-fee-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run200-new-free-image-mesh-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-19-run199b-native-sevenview-human-reviewed-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run200_free_new_providers_native_qa.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight original prototype, v3, Run199, native reference and rejected GLB registry
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run200-NEW-ANONYMOUS-IMAGE-TO-3D-NO_RELEASE"
          mkdir -p "$O"
          for f in owl-pet/AGENTS.md owl-pet/README.md owl-pet/prototype/index.html owl-pet/research/species/172-tyto-castanops-v3.md "$R/known_rejected_asset_sha256_registry.json" "$R/2026-11-19-run199b-native-sevenview-human-reviewed-ART_REJECTED-NO_RELEASE.md"; do
            test -s "$f"
            sha256sum "$f" >> "$O/preflight_sha256.txt"
          done
          sha256sum "$R/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png" > "$O/original_reference_sha256.txt"
          grep -q '^5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9 ' "$O/original_reference_sha256.txt"
          python -m py_compile "$R/tools/run200_free_new_providers_native_qa.py"
      - name: Install open-source Chromium and real GLB native scene inspector renderer
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run200-NEW-ANONYMOUS-IMAGE-TO-3D-NO_RELEASE
          sudo apt-get update -qq > "$O/apt.log" 2>&1
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 >> "$O/apt.log" 2>&1
          python -m pip install -q playwright==1.55.0 trimesh==4.10.0 numpy==2.2.6 pillow==12.0.0 vtk==9.6.2 > "$O/pip.log" 2>&1
          python -m playwright install chromium > "$O/chromium.log" 2>&1
      - name: Actually operate real public free image-to-3D UI with pinned mesoptile and audit true sculpt access
        timeout-minutes: 8
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run200-NEW-ANONYMOUS-IMAGE-TO-3D-NO_RELEASE"
          VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow timeout 440s python -u "$R/tools/run200_free_new_providers_native_qa.py" 2>&1 | tee "$O/run200_actual_execution.log"
      - name: Build audited status and verify SHA256 without any false release claim
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,datetime
          from pathlib import Path
          r=Path('owl-pet/3d-experiments/172-tyto-castanops')
          o=r/'research-evidence-run200-NEW-ANONYMOUS-IMAGE-TO-3D-NO_RELEASE'
          o.mkdir(exist_ok=True,parents=True)
          p=o/'run200_results.json'
          d=json.loads(p.read_text()) if p.is_file() else {'final_status':'RUNNER_FAILED_OR_TIMEOUT','errors':['NO_RESULT_JSON']}
          views=bool(d.get('real_native_7view'))
          status=d.get('final_status','UNKNOWN')
          if not (o/'NO_RELEASE.flag').exists(): (o/'NO_RELEASE.flag').write_text('NO_RELEASE\n')
          lines=[
           '# Run200 — actual no-fee image-to-3D and artist-made baby owl source gate',
           '',
           '**'+status+' / NATIVE_SEVEN_VIEW='+str(views)+' / ART_NOT_APPROVED / NO_RELEASE.**',
           '',
           'UTC '+datetime.datetime.now(datetime.timezone.utc).isoformat(),
           'Preflight: read repository AGENTS, README, original WebGL cat prototype, Tyto castanops v3 scientific/design boundary, Run199b artist rejection, rejected-native-GLB SHA256 registry, original rightmost mesoptile PNG exact SHA256 5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9.',
           'New anonymous free photo-to-GLB source tested in real Chromium: https://3daistudio.pro/ . Provider claims free image-to-3D Hunyuan3D-2 and GLB download without signup; provider claims are NOT proof of actual generation. Human CAPTCHA/Turnstile is never bypassed. Tested artist-made free baby owl sculpt page: https://www.cgtrader.com/free-3d-models/animal/bird/free-baby-owl-sculpt (marketplace royalty-free no-AI, source license must be honored; no paid download, account workaround or raw third-party redistribution).',
           'Observed browser events: '+json.dumps(d.get('events',[]),ensure_ascii=False),
           'Observed first-party HTTP responses: '+json.dumps(d.get('network',[]),ensure_ascii=False),
           'Actual original-source upload SHA256: '+str(d.get('reference_sha256')),
           'Native GLB acquired and independent of known rejected fingerprints: '+str(d.get('new_glb',False))+'. Native bytes: '+str(d.get('native_model_bytes'))+'. Native sha256: '+str(d.get('native_model_sha256'))+'. Real GLB geometry: '+json.dumps(d.get('geometry',{}),ensure_ascii=False)+'. Genuine seven native VTK views: '+str(views)+'.',
           'Blocked stage/errors: '+json.dumps(d.get('errors',[]),ensure_ascii=False),
           'Regardless of structural import, quality must pass natural cream mesoptile, continuous heart facial disc, black open eyes, recessed down-buried wing, concealed tail, believable rear and tree-hollow support, then actual mobile GPU and safe GLB licensing. NO_ART_PASS or user-facing sample in this run unless independently visually inspected and accepted; this workflow never auto-releases.',
           'No extra payment, no bypass of human verification, no changes to main, 251-species workflow, existing prototype or deployment. Original/source model was held transiently outside repository and deleted; screenshots and hashes only are retained.',
           '**NO_RELEASE.**'
          ]
          audit=r/'2026-11-19-run200-actual-free-provider-and-sculpt-source-NO_RELEASE.md'
          audit.write_text('\n\n'.join(lines)+'\n')
          mf={str(f.relative_to(o)):{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in o.rglob('*') if f.is_file() and f.name!='run200_sha256_manifest.json'}
          (o/'run200_sha256_manifest.json').write_text(json.dumps(mf,indent=2,ensure_ascii=False)+'\n')
          assert all(hashlib.sha256((o/k).read_bytes()).hexdigest()==v['sha256'] for k,v in mf.items())
          assert not list(o.rglob('*.glb'))
          print('RUN200',status,'FILES_HASHED',len(mf),'NO_RELEASE')
          PY
      - name: Preserve raw browser/network/true native renderer evidence 30 days, no original source GLB distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run200-real-free-image-to3d-and-babyowl-sculpt-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run200-NEW-ANONYMOUS-IMAGE-TO-3D-NO_RELEASE/
          retention-days: 30
      - name: Commit research-only audits to isolated branch without touching production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run200-NEW-ANONYMOUS-IMAGE-TO-3D-NO_RELEASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$R/2026-11-19-run200-actual-free-provider-and-sculpt-source-NO_RELEASE.md"
          find "$O" -maxdepth 1 -type f \( -name '*.json' -o -name '*.txt' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only > /tmp/changed_files
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/changed_files; then exit 80; fi
          if grep -Ei '\.(png|glb|obj|fbx|blend|zip|jpg|webp)$' /tmp/changed_files; then exit 81; fi
          if test -s /tmp/changed_files; then
            git commit -m "research(owl172): archive Run200 actual free-generator and baby owl sculpt negative quality gate NO_RELEASE"
            git push origin HEAD:research/owl172-run200-new-free-image-mesh-source
          fi
