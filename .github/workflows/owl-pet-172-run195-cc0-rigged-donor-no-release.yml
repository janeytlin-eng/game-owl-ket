name: owl172 Run195 original CC0 rigged owl donor and native sevenview NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run195-cc0-rigged-owl-animation-donor-gate
    paths:
      - .github/workflows/owl-pet-172-run195-cc0-rigged-donor-no-release.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run195_public_cc0_owl_rigged_donor_gate.py
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run195_native_glb_sevenview.py
permissions:
  contents: write
jobs:
  run195-real-original-no-charge-rigged-donor-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run195-cc0-rigged-owl-animation-donor-gate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-19-run194-inerscene-exact-known-reject-dedup-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run195_public_cc0_owl_rigged_donor_gate.py
            owl-pet/3d-experiments/172-tyto-castanops/tools/run195_native_glb_sevenview.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit exact v3 reference, rejected known models, previous attempt and safe scope
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run195-CC0-RIGGED-DONOR-ART_UNAPPROVED-NO_RELEASE"
          mkdir -p "$O"
          for f in owl-pet/AGENTS.md owl-pet/README.md owl-pet/prototype/index.html owl-pet/research/species/172-tyto-castanops-v3.md "$R/known_rejected_asset_sha256_registry.json" "$R/2026-11-19-run194-inerscene-exact-known-reject-dedup-NO_RELEASE.md"; do
            test -s "$f"
            sha256sum "$f" >> "$O/preflight_sha256.txt"
          done
          sha256sum "$R/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png" | tee "$O/actual_reference_sha256.txt"
          grep -q '^5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9 ' "$O/actual_reference_sha256.txt"
          python -m py_compile "$R/tools/run195_public_cc0_owl_rigged_donor_gate.py" "$R/tools/run195_native_glb_sevenview.py"
      - name: Install free tools for actual browser, native GLB checks and offscreen graphics
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run195-CC0-RIGGED-DONOR-ART_UNAPPROVED-NO_RELEASE
          sudo apt-get update -qq > "$O/apt_update.log" 2>&1
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 > "$O/apt_install_mesa.log" 2>&1
          python -m pip install -q playwright==1.56.0 requests==2.32.5 trimesh==4.10.0 vtk==9.6.2 pillow==12.0.0 numpy > "$O/pip_install.log" 2>&1
          python -m playwright install chromium > "$O/browser_install.log" 2>&1
      - name: Actually browse zero-cost CC0 rigged asset, download legal free ZIP and inspect native GLB
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run195-CC0-RIGGED-DONOR-ART_UNAPPROVED-NO_RELEASE"
          timeout 280s python -u "$R/tools/run195_public_cc0_owl_rigged_donor_gate.py" 2>&1 | tee "$O/actual_source_attempt.log"
      - name: Independently render native imported GLB from seven real camera angles, if acquired
        if: always()
        shell: bash
        timeout-minutes: 3
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run195-CC0-RIGGED-DONOR-ART_UNAPPROVED-NO_RELEASE"
          VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow timeout 165s python -u "$R/tools/run195_native_glb_sevenview.py" 2>&1 | tee "$O/actual_native_render.log"
      - name: Enforce NO_RELEASE and verify all evidence SHA256
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          o=Path("owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run195-CC0-RIGGED-DONOR-ART_UNAPPROVED-NO_RELEASE")
          o.mkdir(parents=True,exist_ok=True)
          (o/"NO_RELEASE.flag").write_text("ART_REJECTED_OR_UNREVIEWED / PHYSICAL_MOBILE_WEBGL_UNTESTED / NEVER SHIP\n")
          mf={p.name:{"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(o.iterdir()) if p.is_file() and p.name!="run195_workflow_evidence_manifest.json"}
          (o/"run195_workflow_evidence_manifest.json").write_text(json.dumps(mf,indent=2)+"\n")
          assert all(hashlib.sha256((o/n).read_bytes()).hexdigest()==x["sha256"] for n,x in mf.items())
          print("RUN195_FILES",len(mf),"VALID_GLB",len(list(o.glob("run195_OWL_*.glb"))),"REAL_VIEWS",len(list(o.glob("run195_TRUE_NATIVE_*.png"))),"NO_RELEASE")
          PY
      - name: Archive original browser, raw model and seven views only in quarantined 30-day artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run195-free-CC0-native-rig-donor-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run195-CC0-RIGGED-DONOR-ART_UNAPPROVED-NO_RELEASE/
          retention-days: 30
      - name: Commit evidence and blocked result only, no original binary or public deployment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run195-CC0-RIGGED-DONOR-ART_UNAPPROVED-NO_RELEASE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find "$O" -maxdepth 1 -type f \( -name '*.json' -o -name '*.txt' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only > /tmp/run195_paths
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/run195_paths; then exit 80; fi
          if grep -Ei '\.(glb|blend|obj|fbx|png|zip|webp|jpg|html)$' /tmp/run195_paths; then exit 81; fi
          if [ -s /tmp/run195_paths ]; then
            git commit -m 'research(owl172): archive Run195 actual CC0 rigged donor audit and NO_RELEASE'
            git push origin HEAD:research/owl172-run195-cc0-rigged-owl-animation-donor-gate
          fi
