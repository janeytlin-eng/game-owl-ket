name: "#172 Run238 true neural 3D PBR material repair + actual WebGL2 QA — NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run238-native-pbr-material-correction-realwebgl-no-release
    paths:
      - '.github/workflows/owl172-run238-genuine-pbr-repair-browser-qa.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run238_native_pbr_material_repair.py'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run238_make_webgl_contact.py'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run237_browser_viewer_RESEARCH_ONLY.html'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  material-correction-real-browser-not-phone-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install zero-paid tools and supported Chromium
        run: |
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m pip install "Pillow==10.4.0"
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run238_native_pbr_material_repair.py owl-pet/3d-experiments/172-tyto-castanops/run238_make_webgl_contact.py
          node --check owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs
      - name: Retrieve hash-pinned genuine Run236 neural 3D GLB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p owl-pet/3d-experiments/172-tyto-castanops/run238-source
          gh run download 44689453387 -R janeytlin-eng/game-owl-ket \
            -n owl172-run236-true-neural-eye-down-art-unapproved-NO-RELEASE \
            -D owl-pet/3d-experiments/172-tyto-castanops/run238-source
          echo '4a4a1b22048734d2926b1e27066dd76f125b4575554b305fd28b3233db300d33  owl-pet/3d-experiments/172-tyto-castanops/run238-source/run236_real_neural_eye_softdown_STUDY_ART_REJECTED_NO_RELEASE.glb' | sha256sum -c -
      - name: Repair only missing native PBR nonmetallic materials without changing any learned geometry
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run238_native_pbr_material_repair.py
      - name: Open corrected native GLB in actual Chromium WebGL2 and inspect 7 real cameras
        run: |
          export OWL172_RUN_LABEL=Run238
          export OWL172_QA_DIR="$PWD/owl-pet/3d-experiments/172-tyto-castanops/run238-evidence"
          export OWL172_GLB_INPUT="$OWL172_QA_DIR/run238_real_juvenile_core_nonmetal_PBR_NATIVE_3D_ART_REJECTED_NO_RELEASE.glb"
          export OWL172_EXPECTED_SHA="$(python -c "import json;print(json.load(open('owl-pet/3d-experiments/172-tyto-castanops/run238-evidence/run238_material_patch_machine_report.json'))['corrected_glb']['sha256'])")"
          xvfb-run -a timeout 430s node owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs
          python owl-pet/3d-experiments/172-tyto-castanops/run238_make_webgl_contact.py
      - name: Archive corrected true GLB, seven actual browser screenshots and negative art verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run238-corrected-real3d-nonmetal-PBR-WEBGL2-ART_REJECTED-NO_RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run238-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run238_native_pbr_material_repair.py
            owl-pet/3d-experiments/172-tyto-castanops/run237_browser_viewer_RESEARCH_ONLY.html
          retention-days: 30
          if-no-files-found: warn
      - name: Persist actual generated QA and PNG montage on isolated research branch
        if: always()
        run: |
          git config user.name owl172-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f owl-pet/3d-experiments/172-tyto-castanops/run238-evidence/*.json 2>/dev/null || true
          git add -f owl-pet/3d-experiments/172-tyto-castanops/run238-evidence/run238_REAL_CHROMIUM_WEBGL2_sevenview_PBR_ART_REJECTED_NO_RELEASE.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'audit(owl172): native nonmetallic PBR WebGL2 evidence, still ART_REJECTED and NO_RELEASE'
            git push origin HEAD:research/owl172-run238-native-pbr-material-correction-realwebgl-no-release || echo 'Binary evidence remains in Actions artifact'
          fi
