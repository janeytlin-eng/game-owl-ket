name: owl172 Run140B replay real textured GLBs fix mobile pivot/portrait framing NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run140b-mobile-rotation-framefix
    paths:
      - .github/workflows/owl-pet-172-run140b-mobile-pivot-framing.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run140b_browser_framing.py
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  real-3d-mobile-framing-no-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run140b-mobile-rotation-framefix
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/owl-pet-172-run140b-mobile-pivot-framing.yml
            owl-pet/3d-experiments/172-tyto-castanops/tools/run140b_browser_framing.py
      - name: Replay exact real full and Blender-reduced textured GLBs from Run140 artifact
        uses: actions/download-artifact@v4
        with:
          name: owl172-run140-real-textured-lod-software-webgl-NO_RELEASE
          run-id: 44067284027
          github-token: ${{ github.token }}
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140b-FRAMED-MOBILE-REPLAY-NO_RELEASE
      - name: Real responsive-portrait mobile and desktop WebGL2 replay
        id: browser
        continue-on-error: true
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run140b-FRAMED-MOBILE-REPLAY-NO_RELEASE"
          test -s "$O/run139_original_RESEARCH_ONLY.glb"
          echo '9a154c9e3aeebb34ebcd6f209760e1d9e21e2f544f2b690dae406d9c8bf878e8  '"$O/run139_original_RESEARCH_ONLY.glb" | sha256sum -c
          python3 -m py_compile "$R/tools/run140b_browser_framing.py"
          npm install --no-save --no-audit --no-fund three@0.169.0
          python3 -m pip install --break-system-packages -q 'playwright>=1.48,<2'
          python3 -m playwright install --with-deps chromium
          python3 "$R/tools/run140b_browser_framing.py" browser 2>&1 | tee "$O/run140b_actual_browser.log"
      - name: Evidentiary checksum and explicit NO_RELEASE
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140b-FRAMED-MOBILE-REPLAY-NO_RELEASE
          mkdir -p "$O"
          echo 'NO_RELEASE: source image-to-3D art rejected; viewport rendering is SwiftShader software GL not a physical phone, with unverified redistribution rights.' > "$O/NO_RELEASE.flag"
          printf 'browser=%s\n' "${{ steps.browser.outcome }}" > "$O/run140b_steps.txt"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O" && sha256sum -c SHA256SUMS.txt > checksum_verification.log)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run140b-centered-rotation-mobile-webgl-no-release
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140b-FRAMED-MOBILE-REPLAY-NO_RELEASE
          retention-days: 30
      - name: Commit research logs/screenshots only, no third-party models
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140b-FRAMED-MOBILE-REPLAY-NO_RELEASE
          git add --sparse "$O"
          git restore --staged -- "$O"/*.glb 2>/dev/null || true
          git diff --cached --name-only > /tmp/run140b_changed
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140b-' /tmp/run140b_changed; then echo SCOPE_VIOLATION; exit 9; fi
          if ! git diff --cached --quiet; then
            git commit -m 'research(owl172): archive Run140B real PBR WebGL2 mobile center pivot and responsive framing QA'
            git push origin HEAD:research/owl172-run140b-mobile-rotation-framefix
          fi
