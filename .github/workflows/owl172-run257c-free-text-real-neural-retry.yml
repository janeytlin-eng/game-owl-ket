name: owl172 Run257c free text-to-native-3D juvenile new upstream retry NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run257c-no-cost-text-native-source-qa-no-release
    paths:
      - .github/workflows/owl172-run257c-free-text-real-neural-retry.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run257c_free_text_true_neural_chick.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  free-text-morphology-actual-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run257c-no-cost-text-native-source-qa-no-release
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-17-run142-upscaled-source-actual-pbr-fourview-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/tools/run257c_free_text_true_neural_chick.py
            .github/workflows/owl172-run257c-free-text-real-neural-retry.yml
            owl-pet/3d-experiments/172-tyto-castanops/run256_real_threejs_viewer_RESEARCH_NO_RELEASE.html
            owl-pet/3d-experiments/172-tyto-castanops/run256_actual_browser_7view_qa.mjs
      - name: Verify preflight and attempt exactly one free keyless text-to-3D draft route
        continue-on-error: true
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run257c-FREE-TEXT-3D-CHICK-STRICT-NO_RELEASE"
          mkdir -p "$O"
          cat owl-pet/AGENTS.md owl-pet/README.md owl-pet/research/species/172-tyto-castanops-v3.md > /dev/null
          test -s "$R/2026-11-17-run142-upscaled-source-actual-pbr-fourview-ART_REJECTED-NO_RELEASE.md"
          python3 -m py_compile "$R/tools/run257c_free_text_true_neural_chick.py"
          python3 -m pip install --break-system-packages -q "requests>=2.31" "Pillow>=10"
          python3 "$R/tools/run257c_free_text_true_neural_chick.py" probe 2>&1 | tee "$O/run257c_public_generation_actual.log"
      - name: Import real non-rejected GLBs and render actual native Cycles four views
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run257c-FREE-TEXT-3D-CHICK-STRICT-NO_RELEASE"
          if [ ! -s "$O/run257c_three_ws_unapproved.glb" ] && [ ! -s "$O/run257c_valley_unapproved.glb" ]; then
            echo "NO_GENUINE_GLTF: no 3D model to Blender-review, no invented renders" | tee "$O/run257c_no_model_skip.txt"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b -t 2 --python-exit-code 42 -P "$R/tools/run257c_free_text_true_neural_chick.py" -- render 2>&1 | tee "$O/run257c_native_blender_actual.log"
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          o=Path('owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run257c-FREE-TEXT-3D-CHICK-STRICT-NO_RELEASE')
          for name in ('three_ws','valley'):
              shots=[o/f'run257c_{name}_{v}_NATIVE_UNAPPROVED.png' for v in ('front','quarter','side','back')]
              if not all(x.is_file() for x in shots):
                  print(name,'not all four native images found; no acceptance')
                  continue
              canvas=Image.new('RGB',(1000,1000),(239,239,239));d=ImageDraw.Draw(canvas)
              for i,shot in enumerate(shots):
                  x,y=i%2*500,i//2*500
                  im=Image.open(shot).convert('RGB').resize((500,500))
                  canvas.paste(im,(x,y))
                  d.text((x+16,y+20),('front','quarter','side','back')[i],fill=(0,0,0))
              canvas.save(o/f'run257c_{name}_four_native_views_NO_RELEASE.jpg',quality=90)
              print('ACTUAL_NATIVE_CONTACT',name)
          PY
      - name: Real Three.js WebGL2 7-camera QA only if native GLB exists
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run257c-FREE-TEXT-3D-CHICK-STRICT-NO_RELEASE"
          MODEL="$O/run257c_three_ws_unapproved.glb"
          if [ ! -s "$MODEL" ]; then
            echo 'NO_GENUINE_GLB: Three.js WebGL2 7-camera render skipped' | tee "$O/run257c_browser_skipped.txt"
            exit 0
          fi
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          export OWL172_RUN_LABEL=run257c_threews_text_real_3d
          export OWL172_GLB_INPUT="$PWD/$MODEL"
          export OWL172_QA_DIR="$PWD/$O/run257c_browser"
          export OWL172_EXPECTED_SHA="$(python3 -c "import json; print(json.load(open('$O/run257c_three_ws_status.json'))['model']['sha256'])")"
          mkdir -p "$OWL172_QA_DIR"
          xvfb-run -a timeout 250s node "$R/run256_actual_browser_7view_qa.mjs" 2>&1 | tee "$O/run257c_browser.log"
      - name: Integrity evidence gate, forbid all public product releases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run257c-FREE-TEXT-3D-CHICK-STRICT-NO_RELEASE
          mkdir -p "$O"
          printf 'ART_UNREVIEWED: NO_RELEASE. Distinct free text-to-3D morphology ablation; not source-plate faithful or rights/mobile/art reviewed. Never deploy or call usable until separately approved.\n' > "$O/NO_RELEASE.flag"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O" && sha256sum -c SHA256SUMS.txt > checksum_verification.log)
          test -s "$O/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run257c-free-text-3d-genuine-experiment-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run257c-FREE-TEXT-3D-CHICK-STRICT-NO_RELEASE
          retention-days: 30
      - name: Archive text/log/screenshot evidence on isolated research branch only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run257c-FREE-TEXT-3D-CHICK-STRICT-NO_RELEASE
          git add --sparse "$O"
          git restore --staged -- "$O"/*.glb 2>/dev/null || true
          git diff --cached --name-only > /tmp/owl143_scope
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run257c-' /tmp/owl143_scope; then echo SCOPE_VIOLATION;exit 9; fi
          if ! git diff --cached --quiet; then
            git commit -m "research(owl172): archive Run257c actual free text-to-3D attempts, no unapproved GLB release"
            git push origin HEAD:research/owl172-run257c-no-cost-text-native-source-qa-no-release
          fi
