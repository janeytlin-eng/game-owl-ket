name: owl172 Run160 three real anonymous public image-to-3D generators isolated NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run160-three-new-anonymous-native-generators
    paths:
      - .github/workflows/owl-pet-172-run160-three-new-anonymous-native-generators.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-3d-free-ui-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run160-three-new-anonymous-native-generators
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/owl-pet-172-run160-three-new-anonymous-native-generators.yml
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run157-sculptly-upload-state-native-preview-audit-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run159-three-new-public-generators-actual-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run157_blender_orbit_if_native.py
            owl-pet/3d-experiments/172-tyto-castanops/tools/run160_three_new_anonymous_native_generators.py
      - name: Preflight prototype, v3, prior audit and rejected model fingerprints
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE"
          mkdir -p "$O"
          test -s owl-pet/AGENTS.md
          test -s owl-pet/README.md
          test -s owl-pet/prototype/index.html
          test -s owl-pet/research/species/172-tyto-castanops-v3.md
          test -s "$R/2026-11-18-run157-sculptly-upload-state-native-preview-audit-NO_RELEASE.md"
          test -s "$R/2026-11-18-run159-three-new-public-generators-actual-NO_RELEASE.md"
          python3 -m py_compile "$R/tools/run160_three_new_anonymous_native_generators.py"
          python3 -m json.tool "$R/known_rejected_asset_sha256_registry.json" >/dev/null
          echo '5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9  owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png' | sha256sum -c | tee "$O/run160_source_sha256.log"
      - name: Actually operate three new free image-to-3D browser sites
        shell: bash
        continue-on-error: true
        timeout-minutes: 24
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE"
          python3 -m pip install --break-system-packages -q 'playwright>=1.48,<2'
          python3 -m playwright install --with-deps chromium
          timeout 1300s python3 -u "$R/tools/run160_three_new_anonymous_native_generators.py" 2>&1 | tee "$O/run160_real_public_browser_execution.log"
      - name: If actually generated GLB exists, perform native Blender four views
        shell: bash
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE"
          if ! find "$O" -maxdepth 1 -type f -name '*_new_ui_generated_3d_UNREVIEWED.glb' -size +100c | grep -q .; then
             echo 'NO NEW DOWNLOADED NATIVE GLB: no Blender or phone WebGL validation.' | tee "$O/run160_blender_not_run.txt"
             exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          python3 - <<'PY'
          from pathlib import Path
          root=Path('owl-pet/3d-experiments/172-tyto-castanops')
          script=(root/'tools/run157_blender_orbit_if_native.py').read_text()
          script=script.replace('research-evidence-run157-SCULPTLY-LIVE-UPLOAD-NO_RELEASE','research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE')
          script=script.replace('RUN157_REAL_BLENDER_4_ORBITS_NO_RELEASE','RUN160_REAL_BLENDER_4_ORBITS_NO_RELEASE')
          (root/'tools/run160_temporary_true_orbits.py').write_text(script)
          PY
          timeout 480s blender -b -t 2 --python-exit-code 33 --python "$R/tools/run160_temporary_true_orbits.py" > "$O/run160_real_blender.log" 2>&1
          grep -q 'RUN160_REAL_BLENDER_4_ORBITS_NO_RELEASE' "$O/run160_real_blender.log"
      - name: Hash evidence and write independent truthful NO_RELEASE audit
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          R=Path('owl-pet/3d-experiments/172-tyto-castanops')
          O=R/'research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE'
          O.mkdir(exist_ok=True,parents=True)
          state=O/'run160_actual_results.json'
          o=json.loads(state.read_text()) if state.exists() else {}
          providers={k:v.get('status','UNKNOWN') for k,v in o.get('providers',{}).items()}
          glbs=o.get('new_valid_glb',[])
          (O/'NO_RELEASE.flag').write_text('NO_RELEASE. Need genuine multi-view art pass and actual mobile WebGL pass. No payment or gated exports.\n')
          evidence=[p for p in sorted(O.iterdir()) if p.is_file() and p.name!='sha256_manifest.json']
          manifest={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in evidence}
          (O/'sha256_manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False))
          for name,item in manifest.items():
              assert hashlib.sha256((O/name).read_bytes()).hexdigest()==item['sha256']
          report=R/'2026-11-18-run160-three-new-public-generators-actual-NO_RELEASE.md'
          report.write_text(
             '# #172 Tyto castanops v3 Run160 — two live public 3D generation controls\n\n'
             '**ART_UNREVIEWED / NO_RELEASE. No accepted baby owl sample.**\n\n'
             'Checked owl-pet/AGENTS.md, README.md, original prototype, scientific '
             'v3 bounds, Run159 confirmed public controls and failed generation/export, and Run157 actual Sculptly preview but export-gated art rejection, '
             'and prior rejected model SHA256 registry. The exact rightmost cream '
             'mesoptile input SHA256 is 5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9.\n\n'
             'This workflow actually opens live public browsers, uploads source via visible UI, '
             'clicks permitted public generation controls, polls for up to 150 s per provider and attempts '
             'user-visible GLB export without login or gate bypass. Three public sites, attempted using user-visible browser widgets: '
             '[Photo3D](https://photo3d.org/), [PicReviver](https://picreviver.com/image-to-3d), and [img.now](https://img.now/image-to-3d-model). '
             'Their advertised availability '
             'does not guarantee real output.\n\n'
             '**Observed result per source:** '+json.dumps(providers,ensure_ascii=False)+'\n\n'
             '**Native newly exported, GLB-header-and-mesh checked assets:** '+str(len(glbs))+'. '
             'Any new asset is still unreviewed, not accepted by artistic criteria. '
             'Blender native four-orbit rendering is attempted only after actual legitimate '
             'native export; mobile GPU is not asserted by browser screenshots. '
             'Evidence: [real screenshots, browser logs, model metadata and SHA256 manifest]'
             '(research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE/). '
             'SHA256 checked '+str(len(manifest))+' primary files. '
             'Any binary GLB is stored ONLY in quarantined Actions artifacts, never Git. '
             'Research branch only, no main merge, 251 species production changes, '
             'prototype edits or deployment. Additional payment $0.\n'
          )
          print('RUN160_SHA256_VERIFIED',len(manifest),'PROVIDERS',providers,'NEW_GLB',len(glbs))
          PY
      - name: Retain private quarantine artifacts for 30 days without release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run160-three-new-public-3d-sources-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE/
          retention-days: 30
          if-no-files-found: warn
      - name: Git commit evidence in isolated research branch only
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run160-THREE-NEW-PUBLIC-FREE-SOURCES-NO_RELEASE"
          git add --sparse "$R/2026-11-18-run160-three-new-public-generators-actual-NO_RELEASE.md"
          find "$O" -type f \( -name '*.json' -o -name '*.txt' -o -name '*.log' -o -name '*.png' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only >/tmp/run160_git_staged.txt
          if grep -Ei '\.(glb|blend|zip|fbx|obj|bin)$' /tmp/run160_git_staged.txt; then echo 'PROHIBITED_BINARY_COMMIT'; exit 7; fi
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/run160_git_staged.txt; then echo 'PROHIBITED_OUT_OF_SCOPE'; exit 8; fi
          if [ -s /tmp/run160_git_staged.txt ]; then
             git commit -m 'research(owl172): archive actual Run160 public free 3D evidence NO_RELEASE'
             git push origin HEAD:research/owl172-run160-three-new-anonymous-native-generators
          fi
