name: owl172 Run194 free CC0 original owl mesh seven-view quarantine NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run194-innerscene-cc0-native-material-multiview
    paths:
      - .github/workflows/owl-pet-172-run194-innerscene-cc0-native-gate.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run194_innerscene_original_cc0_native_sevenview.py
permissions:
  contents: write
jobs:
  run194-isolated-real-glb-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run194-innerscene-cc0-native-material-multiview
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-19-run193b-ci-sevenview-verified-status-correction-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run194_innerscene_original_cc0_native_sevenview.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify audited original photo and repository boundaries
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run194-INNERSCENE-CC0-NATIVE-NO_RELEASE"
          mkdir -p "$O"
          for f in owl-pet/AGENTS.md owl-pet/README.md owl-pet/prototype/index.html owl-pet/research/species/172-tyto-castanops-v3.md "$R/known_rejected_asset_sha256_registry.json" "$R/2026-11-19-run193b-ci-sevenview-verified-status-correction-ART_REJECTED-NO_RELEASE.md"; do
            test -s "$f"
            sha256sum "$f" >> "$O/preflight_sha256.txt"
          done
          sha256sum "$R/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png" | tee "$O/source_reference_sha256.txt"
          grep -q '^5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9 ' "$O/source_reference_sha256.txt"
          python -m py_compile "$R/tools/run194_innerscene_original_cc0_native_sevenview.py"
      - name: Install no-charge offscreen native geometric inspection dependencies
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run194-INNERSCENE-CC0-NATIVE-NO_RELEASE
          sudo apt-get update -qq > "$O/apt_update.log" 2>&1
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 > "$O/apt_install_mesa.log" 2>&1
          python -m pip install -q requests==2.32.5 vtk==9.6.2 trimesh==4.10.0 pillow==12.0.0 numpy > "$O/pip_install.log" 2>&1
      - name: Retrieve actual source license and GLB; import and render 7 cameras
        timeout-minutes: 7
        shell: bash
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run194-INNERSCENE-CC0-NATIVE-NO_RELEASE"
          VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow timeout 390s python -u "$R/tools/run194_innerscene_original_cc0_native_sevenview.py" 2>&1 | tee "$O/actual_run194.log"
      - name: Enforce quarantined no-release state and verify SHA manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run194-INNERSCENE-CC0-NATIVE-NO_RELEASE
          mkdir -p "$O"
          test -s "$O/NO_RELEASE.flag" || printf 'EXECUTION_INCOMPLETE / NO_RELEASE\n' > "$O/NO_RELEASE.flag"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          o=Path("owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run194-INNERSCENE-CC0-NATIVE-NO_RELEASE")
          mf={p.name:{"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(o.iterdir()) if p.is_file() and p.name not in ("run194_final_manifest.json","run194_sha256_manifest.json")}
          (o/"run194_final_manifest.json").write_text(json.dumps(mf,indent=2)+"\n")
          assert all(hashlib.sha256((o/name).read_bytes()).hexdigest()==item["sha256"] for name,item in mf.items())
          print("ORIGINAL_ARTIFACTS",len(mf),"GLB",len(list(o.glob("*.glb"))),"CAMERA_PNGS",len(list(o.glob("run194_native_*.png"))),"NO_RELEASE")
          PY
      - name: Archive original binary and views in isolated 30-day Action artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run194-original-cc0-native-source-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run194-INNERSCENE-CC0-NATIVE-NO_RELEASE/
          retention-days: 30
      - name: Commit original source evidence metadata only on Run194 branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run194-INNERSCENE-CC0-NATIVE-NO_RELEASE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find "$O" -maxdepth 1 -type f \( -name '*.json' -o -name '*.txt' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only > /tmp/run194_paths
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/run194_paths; then exit 80; fi
          if grep -Ei '\.(glb|blend|obj|fbx|png|zip|webp|jpg)$' /tmp/run194_paths; then exit 81; fi
          if [ -s /tmp/run194_paths ]; then
            git commit -m 'research(owl172): archive Run194 real source evidence, native QA and NO_RELEASE'
            git push origin HEAD:research/owl172-run194-innerscene-cc0-native-material-multiview
          fi
