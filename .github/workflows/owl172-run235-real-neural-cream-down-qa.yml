name: "#172 Run235 genuine diffusion mesh cream down groom and LOD — NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run235-hunyuan-diffusion-real-juvenile-down-groom-no-release
    paths:
      - '.github/workflows/owl172-run235-real-neural-cream-down-qa.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run235_real_neural_juvenile_cream_down_native_lod.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  true-neural-mesh-color-down-and-seven-real-spatial-views-no-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free CPU 3D mesh/color/render tools; no paid API
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pillow==10.4.0" "trimesh==4.4.9" "vtk==9.3.1" "scipy==1.14.1"
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run235_real_neural_juvenile_cream_down_native_lod.py
      - name: Read original unmodified 3D source from actual completed Run233 native GLB evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p owl-pet/3d-experiments/172-tyto-castanops/run235-input
          gh run download 44668960253 -R janeytlin-eng/game-owl-ket \
            -n owl172-run233-official-hunyuan3dmini-CPU-evidence-no-art-approval-NO_RELEASE \
            -D owl-pet/3d-experiments/172-tyto-castanops/run235-input
          test -s owl-pet/3d-experiments/172-tyto-castanops/run235-input/run233_real_official_Hunyuan3Dmini_CPU_SHAPE_ART_NOT_APPROVED.glb
          test -s owl-pet/3d-experiments/172-tyto-castanops/run235-input/run233_owl_pupils_restored_2D_input_only.png
          sha256sum owl-pet/3d-experiments/172-tyto-castanops/run235-input/run233_real_official_Hunyuan3Dmini_CPU_SHAPE_ART_NOT_APPROVED.glb
      - name: Actually generate new native GLB and seven true 3D views on zero additional fee CPU
        env:
          RUN235_SOURCE: ${{ github.workspace }}/owl-pet/3d-experiments/172-tyto-castanops/run235-input/run233_real_official_Hunyuan3Dmini_CPU_SHAPE_ART_NOT_APPROVED.glb
          RUN235_INPUT_IMAGE: ${{ github.workspace }}/owl-pet/3d-experiments/172-tyto-castanops/run235-input/run233_owl_pupils_restored_2D_input_only.png
        run: |
          xvfb-run -a timeout 1200s python -u owl-pet/3d-experiments/172-tyto-castanops/run235_real_neural_juvenile_cream_down_native_lod.py
          python -c "import json;from pathlib import Path;p=Path('owl-pet/3d-experiments/172-tyto-castanops/run235-evidence/run235_machine_report.json');r=json.loads(p.read_text());assert r['status']=='REAL_3D_GLB_7_VIEWS_ART_REJECTED_NO_RELEASE',r['status']"
      - name: Upload actual GLB seven views and diagnostics — NOT APPROVED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run235-actual-3d-mesoptile-textured-groom-ART_REJECTED-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/run235-evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive negative visual evidence only to isolated branch
        if: always()
        run: |
          git config user.name owl172-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f owl-pet/3d-experiments/172-tyto-castanops/run235-evidence/run235_machine_report.json 2>/dev/null || true
          git add -f owl-pet/3d-experiments/172-tyto-castanops/run235-evidence/run235_real3d_sevenview_ART_REJECTED_NO_RELEASE.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'audit(owl172): preserve Run235 actual seven-view 3D rejection evidence, NO RELEASE'
            git push origin HEAD:research/owl172-run235-hunyuan-diffusion-real-juvenile-down-groom-no-release || echo 'push disabled: evidence artifact still archived'
          fi
