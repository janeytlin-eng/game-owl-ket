name: owl172 Run258p authentic provider GLB normals and native QA NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run258p-real-glb-normals-fourview-repair-no-release
    paths:
      - .github/workflows/owl172-run258p-blender-native-20k-normals-qa-no-release.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run258p_blender_native_glb_normal_repair_fourview.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  actual-native-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run258p-real-glb-normals-fourview-repair-no-release
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops/tools/run258p_blender_native_glb_normal_repair_fourview.py
            owl-pet/3d-experiments/172-tyto-castanops/run256_actual_browser_7view_qa.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run256_real_threejs_viewer_RESEARCH_NO_RELEASE.html
            .github/workflows/owl172-run258p-blender-native-20k-normals-qa-no-release.yml
      - name: Retrieve exact Run258 already-generated real GLB without another generation or fee
        uses: actions/download-artifact@v4
        with:
          name: owl172-run258-hy3d-actual-free-neural-native-NO_RELEASE
          run-id: 44851555389
          github-token: ${{ github.token }}
          path: /tmp/run258-verified
      - name: True Blender import normal fix roundtrip and four native camera views
        id: native
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run258p-NATIVE-NORMALS-REAL-BLENDER-NO_RELEASE"
          mkdir -p "$O"
          INPUT=/tmp/run258-verified/run258_original_NATIVE_PROVIDER_RESEARCH_ONLY.glb
          sha256sum "$INPUT" | tee "$O/run258p_actual_original_sha.txt"
          test "$(sha256sum "$INPUT" | cut -d' ' -f1)" = "d5811563a24061587d9fcf737d40f094cbe0bb58e77288ebed9e94ba43378065"
          cp "$INPUT" "$O/run258p_original_from_actual_run258_RESEARCH_ONLY.glb"
          python3 -m py_compile "$R/tools/run258p_blender_native_glb_normal_repair_fourview.py"
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b -t 2 -P "$R/tools/run258p_blender_native_glb_normal_repair_fourview.py" 2>&1 | tee "$O/run258p_actual_blender.log"
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          o=Path('owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run258p-NATIVE-NORMALS-REAL-BLENDER-NO_RELEASE')
          sheet=Image.new('RGB',(1000,1000),(237,236,234))
          for i,v in enumerate(['front','quarter','side','back']):
              image=Image.open(o/('run258p_'+v+'_ACTUAL_BLENDER_ART_UNAPPROVED.png')).convert('RGB')
              sheet.paste(image,((i%2)*500,(i//2)*500))
              ImageDraw.Draw(sheet).text(((i%2)*500+12,(i//2)*500+12),v,fill=(0,0,0))
          sheet.save(o/'run258p_ACTUAL_NATIVE_FOURVIEW_ART_UNAPPROVED.jpg',quality=86)
          PY
      - name: True 7-view Chromium WebGL2 on repaired actual native provider GLB
        if: always()
        continue-on-error: true
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run258p-NATIVE-NORMALS-REAL-BLENDER-NO_RELEASE"
          M="$O/run258p_REAL_NATIVE_NORMAL_REPAIR_ART_UNAPPROVED.glb"
          if [ ! -s "$M" ]; then
            echo 'NO_REPAIRED_GLB: genuine browser 7-view intentionally SKIPPED' | tee "$O/run258p_browser_skipped.txt"
            exit 0
          fi
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          export OWL172_RUN_LABEL=run258p_native_fixed_normals
          export OWL172_GLB_INPUT="$PWD/$M"
          export OWL172_QA_DIR="$PWD/$O/run258p_real_webgl2"
          export OWL172_EXPECTED_SHA="$(sha256sum "$M" | cut -d' ' -f1)"
          mkdir -p "$OWL172_QA_DIR"
          xvfb-run -a timeout 280s node "$R/run256_actual_browser_7view_qa.mjs" 2>&1 | tee "$O/run258p_actual_webgl2.log"
      - name: Actual research evidence plus checksum manifest — keep NO_RELEASE
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run258p-NATIVE-NORMALS-REAL-BLENDER-NO_RELEASE
          mkdir -p "$O"
          printf 'NO_RELEASE; no invented soft fluff, no commercial rights verified, no physical phone verified; real native 3D study only.\n' > "$O/NO_RELEASE.flag"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O" && sha256sum -c SHA256SUMS.txt > checksum_verification.log)
          test -s "$O/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run258p-actual-native-blender-webgl2-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run258p-NATIVE-NORMALS-REAL-BLENDER-NO_RELEASE
          retention-days: 30
      - name: Push separate scope-limited nonbinary research logs and actual views
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run258p-NATIVE-NORMALS-REAL-BLENDER-NO_RELEASE
          find "$O" -type f ! -name '*.glb' ! -name '*.zip' -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only > /tmp/run258p_changed
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run258p-' /tmp/run258p_changed; then
            echo SCOPE_VIOLATION; exit 9
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'research(owl172): archive Run258p actual native normal repair and 11-view evidence NO_RELEASE'
            git push origin HEAD:research/owl172-run258p-real-glb-normals-fourview-repair-no-release
          fi
