name: owl172 Run137 actual free browser-to-GLB 4-view strict quarantine
on:
  push:
    branches:
      - research/owl172-run137-public-browser-image3d-actual
    paths:
      - .github/workflows/owl-pet-172-run137-free-public-browser-native.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run137_public_browser_image3d.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-free-no-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run137-public-browser-image3d-actual
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run117-FREE-TRELLIS-QUOTA-RECHECK-ART_REJECTED/rightmost_baby_owl_512_rgba.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run137_public_browser_image3d.py
            .github/workflows/owl-pet-172-run137-free-public-browser-native.yml
      - name: Real Playwright browser attempts through free no-login UI
        id: browser
        continue-on-error: true
        timeout-minutes: 26
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run137-PUBLIC-BROWSER-REAL-GLB-STRICT-NO_RELEASE"
          mkdir -p "$O"
          python3 -m py_compile "$R/tools/run137_public_browser_image3d.py"
          python3 -m pip install --break-system-packages -q "Pillow>=10" "playwright>=1.48,<2"
          python3 -m playwright install --with-deps chromium
          python3 "$R/tools/run137_public_browser_image3d.py" browse 2>&1 | tee "$O/run137_actual_browser.log"
      - name: Actual Blender four-view rendering only if valid native binary GLB
        id: native
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run137-PUBLIC-BROWSER-REAL-GLB-STRICT-NO_RELEASE"
          mkdir -p "$O"
          if [ ! -s "$O/run137_verified_raw_provider_RESEARCH_ONLY.glb" ]; then
            echo "NO_REAL_PROVIDER_GLB: Blender rendering skipped; never fabricate" | tee "$O/run137_blender_skipped.txt"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b -t 2 -P "$R/tools/run137_public_browser_image3d.py" -- render 2>&1 | tee "$O/run137_actual_cycles.log"
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          o=Path("owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run137-PUBLIC-BROWSER-REAL-GLB-STRICT-NO_RELEASE")
          shots=[o/("run137_"+s+"_ACTUAL_BLENDER_UNAPPROVED.png") for s in ("front","quarter","side","back")]
          assert all(p.is_file() for p in shots)
          canvas=Image.new("RGB",(960,960),(235,235,235))
          for i,p in enumerate(shots):
            canvas.paste(Image.open(p).convert("RGB"),((i%2)*480,(i//2)*480))
          canvas.save(o/"run137_actual_four_native_views_UNAPPROVED.jpg",quality=83)
          PY
      - name: Quarantine, checksum real evidence and enforce no-release
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run137-PUBLIC-BROWSER-REAL-GLB-STRICT-NO_RELEASE
          mkdir -p "$O"
          echo "NO_RELEASE: real GLB, if present, is research-only. No publication, product integration or claims of art/rights/physical-phone QA." > "$O/NO_RELEASE.flag"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O" && sha256sum -c SHA256SUMS.txt > checksum_verification.log)
          test -s "$O/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run137-free-public-native-RESEARCH-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run137-PUBLIC-BROWSER-REAL-GLB-STRICT-NO_RELEASE
          retention-days: 30
      - name: Commit audit files only (never distribute unreviewed third-party GLB)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run137-PUBLIC-BROWSER-REAL-GLB-STRICT-NO_RELEASE
          git add --sparse "$O"
          git restore --staged -- "$O"/*.glb 2>/dev/null || true
          git diff --cached --name-only > /tmp/owl137_changes
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run137-' /tmp/owl137_changes; then echo SCOPE_VIOLATION; exit 9; fi
          if ! git diff --cached --quiet; then
            git commit -m "research(owl172): archive Run137 real free browser generation and strict no-release QA"
            git push origin HEAD:research/owl172-run137-public-browser-image3d-actual
          fi
