name: "#172 Run252 continuous native neural silhouette ablation 14-view — NO_RELEASE"
on:
  push:
    branches:
      - research/owl172-run252-continuous-tail-silhouette-ablation-no-release
    paths:
      - '.github/workflows/owl172-run252-native-silhouette-ablation-sevenview-no-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  native-silhouette-negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install no-fee genuine mesh and browser QA tools
        run: |
          python -m pip install "numpy==2.3.5" "trimesh==4.11.1" "Pillow==12.3.0"
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run252_continuous_posterior_silhouette_ablation.py
      - name: Recover SHA-pinned authentic Hunyuan GLB with Run251 dark eyes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC=owl-pet/3d-experiments/172-tyto-castanops/run252-source
          mkdir -p "$SRC"
          gh run download 44798375236 -R janeytlin-eng/game-owl-ket -n owl172-run251-neural-ocular-PBR-posterior-volume-AB-14views-NO_RELEASE -D "$SRC"
          echo 'cd1513ac0822eef25bb56f9f8d08d244cac64d209ea8c92333693d287c926eb6  owl-pet/3d-experiments/172-tyto-castanops/run252-source/run251-evidence/run251_A_authentic_neural_owl_eye_repair_tail_surgery_NO_RELEASE.glb' | sha256sum -c -
      - name: Execute real native continuous deformation and inversion reject
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run252_continuous_posterior_silhouette_ablation.py \
            --source owl-pet/3d-experiments/172-tyto-castanops/run252-source/run251-evidence/run251_A_authentic_neural_owl_eye_repair_tail_surgery_NO_RELEASE.glb \
            --outdir owl-pet/3d-experiments/172-tyto-castanops/run252-evidence
      - name: Actual browser GLTFLoader WebGL2 seven different camera positions per GLB
        run: |
          set -euo pipefail
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run252-evidence
          for V in C D; do
            export OWL172_RUN_LABEL="Run252_"$V"_authentic_neural_3d_NO_RELEASE"
            export OWL172_QA_DIR="$PWD/$EVID/browser_$V"
            export OWL172_GLB_INPUT="$PWD/$EVID/run252_"$V"_real_neural_silhouette_GLb_ART_UNAPPROVED_NO_RELEASE.glb"
            export OWL172_EXPECTED_SHA="$(python -c "import json; r=json.load(open('$EVID/run252_geometry_report.json'));print(r['variants']['$V']['sha256'])")"
            mkdir -p "$OWL172_QA_DIR"
            xvfb-run -a timeout 340s node owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs
          done
      - name: Independent SHA screenshot integrity, strict no release contact
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import hashlib,json
          root=Path("owl-pet/3d-experiments/172-tyto-castanops/run252-evidence")
          root.mkdir(parents=True,exist_ok=True)
          cameras=["front","left","threequarter","right","back","top","bottom"]
          summary={"run":"Run252","art_approved":False,"release":"NO_RELEASE","phone_gpu":"UNTESTED","variants":{}}
          frames=[]
          for v in "CD":
              rp=root/("browser_"+v)/"run237_machine_report.json"
              if not rp.exists():
                  summary["variants"][v]={"status":"MISSING_REPORT"}
                  continue
              r=json.loads(rp.read_text())
              summary["variants"][v]={"status":r.get("status"),"gates":r.get("gates"),"driver":r.get("browser",{}).get("renderer",{})}
              for view in cameras:
                  p=rp.parent/("run237_"+view+"_WEBGL_RESEARCH_NOT_APPROVED.png")
                  entries=[q for q in r.get("views",[]) if q.get("name")==view]
                  assert p.exists() and len(entries)==1,(v,view)
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==entries[0]["screenshot"]["sha256"],(v,view)
                  frames.append((v,view,Image.open(p).convert("RGB")))
          if len(frames)==14:
              sheet=Image.new("RGB",(1380,1480),(235,238,241))
              draw=ImageDraw.Draw(sheet)
              for i,(v,view,frame) in enumerate(frames):
                  x=(i%4)*345;y=(i//4)*370
                  sheet.paste(frame.resize((337,337)),(x+3,y+29))
                  draw.text((x+5,y+8),"Run252 "+v+" "+view+" UNAPPROVED",fill=(16,16,16))
              target=root/"run252_CD_14_ACTUAL_WEBGL2_VIEWS_ART_UNAPPROVED.png"
              sheet.save(target)
              summary["contact_sha256"]=hashlib.sha256(target.read_bytes()).hexdigest()
          (root/"run252_webgl_report.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run252-native-silhouette-ablation-CD-14views-ART-REJECT-NO-RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run252-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run252_continuous_posterior_silhouette_ablation.py
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve only dedicated 172 research evidence, never main/production
        if: always()
        run: |
          git config user.name owl172-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run252-evidence
          git add -f "$EVID"/*.json 2>/dev/null || true
          git add -f "$EVID"/run252_CD_14_ACTUAL_WEBGL2_VIEWS_ART_UNAPPROVED.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "audit(owl172): Run252 14-view genuine neural WebGL2 evidence ART_UNAPPROVED NO_RELEASE"
            git pull --rebase origin research/owl172-run252-continuous-tail-silhouette-ablation-no-release
            git push origin HEAD:research/owl172-run252-continuous-tail-silhouette-ablation-no-release
          fi
