    <script>
      window.addEventListener("error", function (event) {
        const errorObj = {
          message: event.message,
          source: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error ? event.error.stack : null
        };
        window.parent.postMessage(
          { action: "error", error: JSON.stringify(errorObj) },
          "*"
        );
        event.preventDefault();
      });

  function handleImportError(error) {
    throw new Error('Import module failed: ' + error.target.src);
  }

  const observer = new MutationObserver(mutations => {
    mutations.forEach(mutation => {
      mutation.addedNodes.forEach(node => {
        if (node.tagName === 'SCRIPT' && node.type === 'module') {
          node.onerror = handleImportError;
        }
      });
    });
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });

  document.querySelectorAll('script[type="module"]').forEach(script => {
    script.onerror = handleImportError;
  });

  
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});

    <script type="text/babel" data-type="module">
      		  import {createRoot} from "react-dom/client";
            
      		  
import React, { useState, useEffect, useCallback, useRef } from 'react';
import { Play, RotateCcw, Volume2, VolumeX, Heart, Volume1, Map, CheckCircle2, ArrowRight, Store, Coins, Check, TreeDeciduous, Flame, Cloud, BookOpen, Gem } from 'lucide-react';

// === 1. 词库引擎区 ===
const MASTER_DICT = [
  {en:"ability",zh:"能力"},{en:"able",zh:"能够的"},{en:"abroad",zh:"在国外"},{en:"absent",zh:"缺席的"},{en:"accept",zh:"接受"},
  {en:"accident",zh:"事故"},{en:"ache",zh:"疼痛"},{en:"achieve",zh:"达到/完成"},{en:"across",zh:"穿过"},{en:"act",zh:"行动/表演"}
];

const WORDS_PER_LEVEL = 5;
const KET_LEVELS = [];
for (let i = 0; i < MASTER_DICT.length; i += WORDS_PER_LEVEL) {
  KET_LEVELS.push({ id: (i / WORDS_PER_LEVEL) + 1, title: `Level ${(i / WORDS_PER_LEVEL) + 1}`, words: MASTER_DICT.slice(i, i + WORDS_PER_LEVEL) });
}

// === 2. 花园商店物品配置 ===
const GARDEN_ITEMS = [
  { id: 'sunflower', name: '向日葵', price: 50, icon: '🌻', bottom: '15%', left: '15%', size: 'text-5xl' },
  { id: 'tree', name: '苹果树', price: 100, icon: '🌳', bottom: '30%', left: '75%', size: 'text-7xl' },
  { id: 'fountain', name: '许愿池', price: 150, icon: '⛲', bottom: '20%', left: '45%', size: 'text-6xl' },
  { id: 'tent', name: '露营帐篷', price: 200, icon: '⛺', bottom: '10%', left: '60%', size: 'text-6xl' },
  { id: 'snowman', name: '小雪人', price: 80, icon: '⛄', bottom: '12%', left: '30%', size: 'text-5xl' },
];

const MAX_LIVES = 3;

function OwlGame() {
  const [gameState, setGameState] = useState('map'); 
  const [playMode, setPlayMode] = useState('meaning'); 
  
  const [currentLevelId, setCurrentLevelId] = useState(1);
  const [progress, setProgress] = useState(0); 
  const [targetProgress, setTargetProgress] = useState(10); 
  
  const [coins, setCoins] = useState(0);
  const [gardenItems, setGardenItems] = useState([]); 
  
  // 错题本系统
  const [gems, setGems] = useState([]); 
  const [isReviewMode, setIsReviewMode] = useState(false);

  const [lives, setLives] = useState(MAX_LIVES);
  const [owlLane, setOwlLane] = useState(1); 
  const [barrierX, setBarrierX] = useState(100);
  
  const [remainingWords, setRemainingWords] = useState([]);
  const [currentWord, setCurrentWord] = useState(null);
  const [currentOptions, setCurrentOptions] = useState([]);
  const [missingCharIndex, setMissingCharIndex] = useState(0);
  
  const [isMuted, setIsMuted] = useState(false);
  const [isHit, setIsHit] = useState(false); 
  const [isPassing, setIsPassing] = useState(false); 
  const [isSpeaking, setIsSpeaking] = useState(false);

  const [combo, setCombo] = useState(0); 
  const isFever = combo >= 3; 

  const requestRef = useRef();
  const speedRef = useRef(0.5); 
  const hitThisRoundRef = useRef(false); 
  
  const isMutedRef = useRef(isMuted);
  const livesRef = useRef(lives);
  useEffect(() => { isMutedRef.current = isMuted; }, [isMuted]);
  useEffect(() => { livesRef.current = lives; }, [lives]);

  // === 🎵 音频引擎 (完美保留) ===
  const speakWord = useCallback((wordStr) => {
    if (isMutedRef.current || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(wordStr);
    utterance.lang = 'en-GB'; utterance.rate = 0.85; 
    utterance.onstart = () => setIsSpeaking(true);
    utterance.onend = () => setIsSpeaking(false);
    window.speechSynthesis.speak(utterance);
  }, []);

  const audioCtxRef = useRef(null);
  const bgmIntervalRef = useRef(null);
  const bgmIndexRef = useRef(0);

  const initAudio = useCallback(() => {
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
  }, []);

  const playTone = useCallback((freq, type, duration, vol = 0.1) => {
    if (isMutedRef.current || !audioCtxRef.current) return;
    const osc = audioCtxRef.current.createOscillator();
    const gain = audioCtxRef.current.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtxRef.current.currentTime);
    gain.gain.setValueAtTime(vol, audioCtxRef.current.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtxRef.current.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtxRef.current.destination);
    osc.start(); osc.stop(audioCtxRef.current.currentTime + duration);
  }, []);

  const playMove = useCallback(() => playTone(600, 'sine', 0.1, 0.05), [playTone]);
  const playCrash = useCallback(() => playTone(150, 'sawtooth', 0.3, 0.1), [playTone]);
  const playScore = useCallback((fever) => {
    if(fever) { playTone(1046, 'sine', 0.1, 0.05); setTimeout(() => playTone(1567, 'sine', 0.2, 0.05), 100); } 
    else { playTone(880, 'sine', 0.1, 0.05); setTimeout(() => playTone(1318, 'sine', 0.2, 0.05), 100); }
  }, [playTone]);
  const playBuy = useCallback(() => { [1046, 1567, 2093].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.1, 0.05), i * 100)); }, [playTone]);
  const playVictory = useCallback(() => { [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => setTimeout(() => playTone(freq, 'sine', 0.2, 0.1), i * 150)); }, [playTone]);

  const startBGM = useCallback(() => {
    if (bgmIntervalRef.current) clearInterval(bgmIntervalRef.current);
    const notes = isFever ? [392.00, 493.88, 587.33, 783.99, 587.33, 493.88] : [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; 
    bgmIntervalRef.current = setInterval(() => {
      if (!isMutedRef.current && audioCtxRef.current) { playTone(notes[bgmIndexRef.current % notes.length] / 2, isFever ? 'square' : 'triangle', 0.2, isSpeaking ? 0.005 : 0.02); bgmIndexRef.current++; }
    }, isFever ? 300 : 400); 
  }, [playTone, isSpeaking, isFever]);

  useEffect(() => {
    if (gameState === 'playing') startBGM();
    else if (bgmIntervalRef.current) clearInterval(bgmIntervalRef.current);
    return () => clearInterval(bgmIntervalRef.current);
  }, [gameState, startBGM, isSpeaking, isFever]);

  // === ⌨️ 键盘控制逻辑 ===
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (gameState !== 'playing') return;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault();
        setOwlLane(prev => { const next = Math.max(0, prev - 1); if(next !== prev) playMove(); return next; });
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault();
        setOwlLane(prev => { const next = Math.min(2, prev + 1); if(next !== prev) playMove(); return next; });
      }
    };
    window.addEventListener('keydown', handleKeyDown, { passive: false });
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [gameState, playMove]);

  // === 🎮 游戏核心逻辑 ===
  const generateOptions = useCallback((word, mode) => {
    if (mode === 'meaning') {
      const others = MASTER_DICT.filter((w) => w.en !== word.en).sort(() => 0.5 - Math.random());
      return [word, others[0], others[1]].sort(() => 0.5 - Math.random());
    } else {
      const wordStr = word.en;
      const blankIdx = Math.floor(Math.random() * wordStr.length);
      setMissingCharIndex(blankIdx);
      const correctChar = wordStr[blankIdx];
      const alphabet = "abcdefghijklmnopqrstuvwxyz".replace(correctChar, "");
      const wrongChars = alphabet.split('').sort(() => 0.5 - Math.random()).slice(0, 2);
      return [
        { en: word.en, text: correctChar, isCorrect: true },
        { en: word.en + '_w1', text: wrongChars[0], isCorrect: false },
        { en: word.en + '_w2', text: wrongChars[1], isCorrect: false }
      ].sort(() => 0.5 - Math.random());
    }
  }, []);

  const initRound = useCallback((pool, mode) => {
    if (!pool || pool.length === 0) return;
    const nextWord = pool[Math.floor(Math.random() * pool.length)];
    setCurrentWord(nextWord);
    setCurrentOptions(generateOptions(nextWord, mode));
    setBarrierX(100); hitThisRoundRef.current = false; 
    speakWord(nextWord.en);
  }, [generateOptions, speakWord]);

  const startGame = (levelId) => {
    initAudio(); setCurrentLevelId(levelId); setIsReviewMode(false);
    const levelData = KET_LEVELS.find(l => l.id === levelId);
    setRemainingWords([...levelData.words]); setTargetProgress(levelData.words.length);
    setProgress(0); setCombo(0); setLives(MAX_LIVES); setOwlLane(1);
    speedRef.current = 0.5 + (levelId * 0.01); 
    initRound([...levelData.words], playMode); setGameState('playing');
  };

  const startReviewMode = () => {
    initAudio(); setIsReviewMode(true);
    setRemainingWords([...gems]); setTargetProgress(gems.length);
    setProgress(0); setCombo(0); setLives(MAX_LIVES); setOwlLane(1);
    speedRef.current = 0.5; initRound([...gems], playMode); setGameState('playing');
  };

  const handleLaneClick = (laneIndex) => {
    if (gameState !== 'playing') return;
    if (laneIndex !== owlLane) { setOwlLane(laneIndex); playMove(); }
  };

  const updateGame = useCallback(() => {
    if (gameState !== 'playing' || !currentWord) return;

    setBarrierX((prevX) => {
      let currentSpeed = prevX > 85 ? speedRef.current * 0.4 : (isFever ? speedRef.current * 1.3 : speedRef.current);
      const newX = prevX - currentSpeed;
      
      if (newX <= 25 && newX >= 10) {
        let isCorrectChoice = playMode === 'meaning' ? currentOptions[owlLane].en === currentWord.en : currentOptions[owlLane].isCorrect;

        if (!isCorrectChoice && !hitThisRoundRef.current) {
          hitThisRoundRef.current = true; setCombo(0); 
          // 记录错题
          if(!isReviewMode) setGems(prev => prev.find(g => g.en === currentWord.en) ? prev : [...prev, currentWord]);
          
          if (livesRef.current <= 1) {
            playCrash(); setLives(0); setGameState('gameover'); return prevX; 
          } else {
            playCrash(); setLives(l => l - 1); setIsHit(true); setTimeout(() => setIsHit(false), 400); 
          }
        }
      }

      if (newX < -10) {
        if (!hitThisRoundRef.current) {
          playScore(combo + 1 >= 3); setCombo(c => c + 1); setProgress(p => p + 1);
          setIsPassing(true); setTimeout(() => setIsPassing(false), 500);
          
          const newRemaining = remainingWords.filter(w => w.en !== currentWord.en);
          setRemainingWords(newRemaining);
          if (isReviewMode) setGems(prev => prev.filter(g => g.en !== currentWord.en)); // 答对消除错题

          if (newRemaining.length === 0) {
             if (!isReviewMode) setCoins(c => c + 50 + (livesRef.current === MAX_LIVES ? 30 : 0)); 
             playVictory(); setGameState('victory'); return 100;
          }
          initRound(newRemaining, playMode); return 100;
        }
        initRound(remainingWords, playMode); return 100;
      }
      return newX;
    });
    requestRef.current = requestAnimationFrame(updateGame);
  }, [gameState, owlLane, currentOptions, currentWord, remainingWords, initRound, playMode, combo, isFever, playScore, playCrash, playVictory, isReviewMode]);

  useEffect(() => {
    if (gameState === 'playing') requestRef.current = requestAnimationFrame(updateGame);
    return () => cancelAnimationFrame(requestRef.current);
  }, [gameState, updateGame]);

  const buyItem = (item) => {
    initAudio();
    if (coins >= item.price && !gardenItems.includes(item.id)) {
      setCoins(c => c - item.price); setGardenItems(prev => [...prev, item.id]); playBuy();
    } else { playCrash(); }
  };

  // 🏡 绝美的上下分层花园
  const GardenView = () => (
    <div className="relative w-full h-full bg-sky-300 overflow-hidden rounded-t-2xl">

       {/* Mobile on-screen controls (shown only during gameplay) */}
       {gameState === 'playing' && (
         <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-4 z-50">
           <button
             onPointerDown={() => setOwlLane(prev => { const next = Math.max(0, prev - 1); if(next !== prev) playMove(); return next; })}
             className="px-5 py-3 bg-white/80 backdrop-blur rounded-xl shadow text-slate-800 font-bold"
             aria-label="Up"
           >上</button>
           <button
             onPointerDown={() => setOwlLane(prev => { const next = Math.min(2, prev + 1); if(next !== prev) playMove(); return next; })}
             className="px-5 py-3 bg-white/80 backdrop-blur rounded-xl shadow text-slate-800 font-bold"
             aria-label="Down"
           >下</button>
         </div>
       )}

       {/* 太阳与云朵 */}
       <div className="absolute top-4 right-10 w-12 h-12 bg-yellow-300 rounded-full shadow-[0_0_40px_rgba(253,224,71,1)]"></div>
       <Cloud className="absolute top-8 left-32 text-white opacity-80" size={48} />
       <Cloud className="absolute top-4 left-1/2 text-white opacity-60" size={32} />
       
       {/* 草地与物品 */}
       <div className="absolute bottom-0 w-full h-[50%] bg-gradient-to-t from-green-500 to-green-400 rounded-t-[40px] shadow-inner border-t-4 border-green-300">
         {GARDEN_ITEMS.map(item => gardenItems.includes(item.id) && (
           <div key={item.id} className={`absolute ${item.size} drop-shadow-xl animate-bounce-slow`} style={{ bottom: item.bottom, left: item.left }}>{item.icon}</div>
         ))}
       </div>

       {/* 🌟 顶部UI (完美避开遮挡) */}
       <div className="absolute top-4 left-4 right-4 flex justify-between z-10">
         {/* 左侧：庄园标题 */}
         <div className="flex items-center gap-2 bg-white/80 backdrop-blur-sm px-4 py-2 rounded-full shadow-md border-2 border-white">
            <span className="text-xl">🦉</span>
            <span className="font-black text-green-800 tracking-wider">猫头鹰庄园</span>
         </div>
         {/* 右侧：金币与商店 */}
         <div className="flex items-center gap-2">
           <div className="flex items-center gap-2 bg-yellow-900/60 backdrop-blur-sm px-3 py-1.5 rounded-full border border-yellow-500">
              <Coins size={18} className="text-yellow-400" />
              <span className="text-yellow-400 font-black">{coins}</span>
           </div>
           <button onClick={() => {initAudio(); setGameState('shop');}} className="flex items-center gap-1 bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded-full text-white font-black shadow-lg transition-transform hover:scale-105">
              <Store size={16} /> 商店
           </button>
         </div>
       </div>
    </div>
  );

  return (
    <div className={`flex flex-col w-full max-w-3xl mx-auto font-sans rounded-2xl overflow-hidden shadow-2xl relative transition-colors duration-500 h-[600px] select-none ${isFever && gameState === 'playing' ? 'bg-orange-950' : 'bg-slate-900'}`}>
      
      {/* 🗺️ 1. 上下分屏的主地图 */}
      {gameState === 'map' && (
        <div className="absolute inset-0 flex flex-col z-40">
          
          {/* 上半部分：50% 的纯净花园区域 */}
          <div className="h-[50%] w-full flex-shrink-0">
             <GardenView />
          </div>

          {/* 下半部分：50% 的操作区 */}
          <div className="h-[50%] w-full bg-slate-900 rounded-t-3xl shadow-[0_-15px_30px_rgba(0,0,0,0.4)] p-6 flex flex-col relative z-20">
            
            {/* 顶栏：标题与模式切换 (不会遮挡花园) */}
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-black text-white flex items-center gap-2">
                <Map size={20} className="text-blue-400"/> 选择关卡
              </h2>
              <div className="flex bg-slate-800 rounded-full p-1 border border-slate-700">
                <button onClick={() => {initAudio(); setPlayMode('meaning');}} className={`px-4 py-1.5 rounded-full font-bold text-sm transition-colors ${playMode === 'meaning' ? 'bg-blue-600 text-white' : 'text-gray-400'}`}>📖 词义</button>
                <button onClick={() => {initAudio(); setPlayMode('spelling');}} className={`px-4 py-1.5 rounded-full font-bold text-sm transition-colors ${playMode === 'spelling' ? 'bg-purple-600 text-white' : 'text-gray-400'}`}>🔤 拼写</button>
              </div>
            </div>

            {/* 横向滚动的关卡列表 + 错题本 */}
            <div className="flex gap-4 overflow-x-auto pb-2 custom-scrollbar items-center flex-1">
              {/* 错题本按钮 (如果有错题则显示) */}
              {gems.length > 0 && (
                <div onClick={startReviewMode} className="min-w-[140px] h-full bg-purple-900/40 border-2 border-purple-500 hover:bg-purple-800/60 rounded-2xl p-4 flex flex-col justify-between cursor-pointer group transition-colors flex-shrink-0 relative overflow-hidden">
                  <div className="absolute -right-4 -bottom-4 opacity-20 text-6xl"><BookOpen /></div>
                  <div className="flex justify-between items-start">
                     <div className="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center font-black text-lg text-white"><Gem size={20}/></div>
                  </div>
                  <div className="relative z-10">
                    <h3 className="text-lg font-bold text-purple-300 mb-1">错题复习</h3>
                    <p className="text-xs text-purple-400">待消除：{gems.length}</p>
                  </div>
                </div>
              )}

              {KET_LEVELS.map((level) => (
                <div key={level.id} onClick={() => startGame(level.id)} className="min-w-[140px] h-full bg-slate-800 border-2 border-slate-700 hover:border-blue-500 rounded-2xl p-4 flex flex-col justify-between cursor-pointer group transition-colors flex-shrink-0">
                  <div className="flex justify-between items-start">
                     <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-lg text-white ${playMode === 'meaning' ? 'bg-blue-600' : 'bg-purple-600'}`}>{level.id}</div>
                     <Play fill="currentColor" size={20} className="text-gray-500 group-hover:text-blue-400" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white mb-1">{level.title}</h3>
                    <p className="text-xs text-gray-400">词汇量：{level.words.length}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* 🛒 2. 花园商店界面 (修复了价格被遮挡的问题) */}
      {gameState === 'shop' && (
        <div className="absolute inset-0 bg-slate-900 flex flex-col items-center z-50 p-6 pt-16">
           <div className="absolute top-4 right-4 flex items-center gap-2 bg-yellow-900/50 px-4 py-2 rounded-full border border-yellow-600"><Coins size={20} className="text-yellow-400" /><span className="text-yellow-400 font-bold">{coins}</span></div>
           <button onClick={() => setGameState('map')} className="absolute top-4 left-4 text-gray-400 hover:text-white flex items-center gap-1"><RotateCcw size={20}/> 返回庄园</button>
           <h2 className="text-3xl font-black text-white mb-8 flex items-center gap-2 text-green-400"><TreeDeciduous/> 庄园集市</h2>
           
           <div className="grid grid-cols-2 gap-4 w-full max-w-md overflow-y-auto pb-6">
             {GARDEN_ITEMS.map(item => {
               const isOwned = gardenItems.includes(item.id);
               return (
                 <div key={item.id} className="min-h-[160px] bg-slate-800 p-4 rounded-xl border-2 border-slate-700 flex flex-col items-center justify-between relative overflow-hidden">
                    {isOwned && <div className="absolute inset-0 bg-green-900/20 z-0"></div>}
                    <span className="text-5xl mb-2 relative z-10 drop-shadow-md">{item.icon}</span>
                    <span className="text-white font-bold mb-3 relative z-10">{item.name}</span>
                    <button onClick={() => buyItem(item)} disabled={isOwned} className={`w-full py-2 rounded-lg font-bold flex items-center justify-center gap-1 relative z-10 flex-shrink-0 ${isOwned ? 'bg-green-600 text-white' : coins >= item.price ? 'bg-yellow-500 text-yellow-900 hover:bg-yellow-400' : 'bg-gray-600 text-gray-400'}`}>
                       {isOwned ? <><Check size={16}/>已拥有</> : <><Coins size={14}/> {item.price}</>}
                    </button>
                 </div>
               );
             })}
           </div>
        </div>
      )}

      {/* 🎮 3. 跑酷主界面 */}
      {(gameState === 'playing' || gameState === 'gameover') && currentWord && (
        <>
          <div className="absolute top-0 left-0 right-0 z-20 flex flex-col">
            <div className="w-full h-2 bg-gray-800"><div className="h-full bg-green-400 transition-all duration-300" style={{ width: `${(progress / targetProgress) * 100}%` }}></div></div>
            <div className={`h-16 flex items-center justify-between px-6 shadow-md backdrop-blur-sm transition-colors ${isFever ? 'bg-orange-900/90' : 'bg-gray-800/90'}`}>
              <div className="flex gap-1">{[...Array(MAX_LIVES)].map((_, i) => <Heart key={i} fill={i < lives ? "#ef4444" : "transparent"} color={i < lives ? "#ef4444" : "#4b5563"} size={16} />)}</div>
              
              <div className="flex flex-col items-center cursor-pointer" onClick={() => {initAudio(); speakWord(currentWord.en);}}>
                 {playMode === 'meaning' ? (
                   <div className="flex flex-col items-center">
                     <span className="text-gray-400 text-[10px] font-bold mb-1 uppercase">{isReviewMode ? '复习模式' : '词义模式'}</span>
                     <div className="flex items-center gap-2">
                       <span className={`font-black text-3xl tracking-wider uppercase drop-shadow-md ${isFever ? 'text-yellow-300' : 'text-blue-400'}`}>{currentWord.en}</span>
                       <Volume1 size={20} className={isSpeaking ? "text-blue-300 animate-pulse" : "text-gray-400"}/>
                     </div>
                   </div>
                 ) : (
                   <div className="flex flex-col items-center">
                     <span className="text-gray-400 text-xs font-bold mb-1">{currentWord.zh}</span>
                     <div className="flex items-center gap-2">
                       <span className={`font-black text-3xl tracking-[0.3em] uppercase drop-shadow-md ${isFever ? 'text-yellow-300' : 'text-purple-400'}`}>
                         {currentWord.en.split('').map((char, idx) => idx === missingCharIndex ? '_' : char).join('')}
                       </span>
                       <Volume1 size={16} className={isSpeaking ? "text-blue-300 animate-pulse" : "text-gray-500"}/>
                     </div>
                   </div>
                 )}
              </div>
              
              <button onClick={() => {initAudio(); setIsMuted(!isMuted);}} className="text-gray-400 p-2 rounded-full hover:bg-gray-700">{isMuted ? <VolumeX size={20} /> : <Volume2 size={20} />}</button>
            </div>
          </div>

          {combo > 0 && !isFever && (
             <div className="absolute top-20 right-6 z-30 font-black text-yellow-400 text-xl animate-pulse italic drop-shadow-lg">{combo} Combo!</div>
          )}

          <div className="relative w-full h-full mt-16 overflow-hidden">
            <div className="absolute inset-0 flex flex-col z-0">
              <div className="flex-1 border-b border-white/5 cursor-pointer hover:bg-white/5" onClick={() => handleLaneClick(0)} />
              <div className="flex-1 border-b border-white/5 cursor-pointer hover:bg-white/5" onClick={() => handleLaneClick(1)} />
              <div className="flex-1 cursor-pointer hover:bg-white/5" onClick={() => handleLaneClick(2)} />
            </div>

            <div className={`absolute left-[15%] transform -translate-x-1/2 -translate-y-1/2 z-10 transition-all duration-200 ${isHit ? 'opacity-50 scale-75 grayscale' : 'scale-100'}`} style={{ top: ['16.6%', '50%', '83.3%'][owlLane] }}>
               <div className={`relative flex items-center justify-center w-16 h-16 transition-transform duration-500 ${isPassing ? 'rotate-[360deg] scale-125 drop-shadow-[0_0_20px_rgba(59,130,246,0.8)]' : (isFever ? 'scale-110' : 'scale-100')}`}>
                 <span className="text-5xl drop-shadow-lg">🦉</span>
                 {isFever && !isHit && <Flame className="absolute -bottom-4 left-2 text-orange-500 animate-pulse" fill="currentColor" size={32}/>}
               </div>
            </div>

            <div className="absolute top-0 bottom-0 w-32 flex flex-col z-0" style={{ left: `${barrierX}%` }}>
              {currentOptions.map((opt, index) => (
                <div key={index} className="flex-1 relative flex items-center justify-center border-l-[6px] border-gray-600 bg-gray-700/80 backdrop-blur-sm">
                  <div className={`bg-white px-4 py-2 rounded-xl font-black text-gray-900 shadow-[0_0_15px_rgba(255,255,255,0.2)] absolute z-20 whitespace-nowrap ${playMode === 'spelling' ? 'text-2xl uppercase' : 'text-lg'}`}>
                    {playMode === 'meaning' ? opt.zh : opt.text}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {/* 🏆 通关结算 */}
      {gameState === 'victory' && (
        <div className="absolute inset-0 bg-green-900/95 flex flex-col items-center justify-center z-50 p-6">
          <CheckCircle2 size={80} className="text-green-400 mb-4 animate-bounce" />
          <h2 className="text-4xl font-black text-white mb-4">Level Cleared!</h2>
          {!isReviewMode && (
            <div className="bg-yellow-500/20 p-4 rounded-xl flex items-center gap-3 mb-8 border border-yellow-500">
               <Coins size={36} className="text-yellow-400"/>
               <div>
                  <p className="text-yellow-400 font-bold">获得金币</p>
                  <p className="text-3xl font-black text-white">+ {lives === MAX_LIVES ? 80 : 50}</p>
               </div>
            </div>
          )}
          <button onClick={() => setGameState('map')} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-full font-black text-xl shadow-lg transition-transform hover:scale-105">
            返回庄园 <ArrowRight />
          </button>
        </div>
      )}

      {/* ❌ 失败结算 */}
      {gameState === 'gameover' && (
        <div className="absolute inset-0 bg-gray-950/95 flex flex-col items-center justify-center z-50 p-6">
          <h2 className="text-4xl font-black text-white mb-6">挑战失败</h2>
          <div className="bg-red-900/40 p-6 rounded-2xl mb-8 text-center border border-red-500/30 w-full max-w-sm">
             <p className="text-gray-400 mb-2">正确答案是</p>
             <p className="text-4xl font-bold text-white tracking-widest mb-2">{currentWord?.en}</p>
             <p className="text-red-400 text-xl">{currentWord?.zh}</p>
          </div>
          <div className="flex flex-col gap-4 w-full max-w-sm">
             <button onClick={() => isReviewMode ? startReviewMode() : startGame(currentLevelId)} className="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-xl font-bold text-xl transition-transform hover:scale-105"><RotateCcw size={24}/>重新挑战</button>
             <button onClick={() => setGameState('map')} className="text-gray-400 hover:text-white underline py-2">返回庄园</button>
          </div>
        </div>
      )}
    </div>
  );
}

      		  createRoot(document.getElementById("root")).render(
             <>
      		    <OwlGame />
              </>
      		    );
              window.parent.postMessage({ action: "ready" }, "*");
    </script>
  </body>
</html>
