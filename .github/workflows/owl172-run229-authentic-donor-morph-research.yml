name: "#172 Run229 authentic adult Tyto morph experiment — always ART UNAPPROVED"
on:
  push:
    branches:
      - research/owl172-run229-authentic-tyto-scan-nonrigid-art-reject
    paths:
      - '.github/workflows/owl172-run229-authentic-donor-morph-research.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run229_authentic_scan_nonrigid.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-mesh-sculpt-qa-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free CPU-only dependencies and Khronos Draco decode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libosmesa6
          python -m pip install --quiet "numpy==1.26.4" "trimesh==4.4.9" "pillow==10.4.0" "vtk==9.3.1" "requests==2.32.3"
          npm install --no-save @gltf-transform/cli@4.5.1
      - name: Fetch CC0-claimed archived real adult Tyto scan and validate SHA, decode via glTF-Transform
        run: |
          set -eu
          D=owl-pet/3d-experiments/172-tyto-castanops/run229-evidence
          mkdir -p "$D"
          python - <<'PY'
          import requests,pathlib,hashlib
          p=pathlib.Path("owl-pet/3d-experiments/172-tyto-castanops/run229-evidence")
          u="https://zenodo.org/api/records/21379215/files/0e65de5934db4f0eae02835ba7227dcc_normalized_optimized.glb/content"
          r=requests.get(u,timeout=(30,150));r.raise_for_status()
          assert len(r.content)==5603344
          assert hashlib.sha256(r.content).hexdigest()=="3fff5130cfad17cc1fcf312819019bad75782f4f01708d18696e100d643691cb"
          (p/"donor_draco_adult.glb").write_bytes(r.content)
          PY
          ./node_modules/.bin/gltf-transform copy "$D/donor_draco_adult.glb" "$D/donor_uncompressed_adult.glb"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("owl-pet/3d-experiments/172-tyto-castanops/run229-evidence/donor_uncompressed_adult.glb")
          print("decoded donor",len(p.read_bytes()),hashlib.sha256(p.read_bytes()).hexdigest())
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="4865f48828adb93cef4f5ec07002adc1a61855a80adb286f781a227fca89430f"
          PY
      - name: Actually morph full genuine adult mesh and render 14 spatial cameras — never auto-approve
        run: xvfb-run -a python -u owl-pet/3d-experiments/172-tyto-castanops/run229_authentic_scan_nonrigid.py
      - name: Archive real GLB, 14 views, executed code and hashes — NOT A RELEASE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run229-true3d-adult-donor-nonrigid-ART_REJECTED-NO_RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run229-evidence
            owl-pet/3d-experiments/172-tyto-castanops/run229_authentic_scan_nonrigid.py
          retention-days: 30
          if-no-files-found: warn
