name: "Owl172 Run317 REAL native SF3D screenshot/GLB capture & WebGL2 - NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run317-stability-public-GLB-real-WebGL2-NO_RELEASE
    paths:
      - '.github/workflows/owl172-run317-official-SF3D-actual-native-GLB-NO_RELEASE.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-public-GLB-and-three-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/design/concepts/172-tyto-castanops-v3.png
            owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run317-stability-real-native-webgl-capture-NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run292_browser_viewer_uncropped_NO_RELEASE.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install no-paid open-source 3D QA tools and chromium
        run: |
          python -m pip install --disable-pip-version-check -q Pillow numpy opencv-python-headless trimesh playwright
          python -m playwright install --with-deps chromium
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run317-stability-real-native-webgl-capture-NO_RELEASE.py
      - name: Rebuild same v3 rightmost juvenile cutout from untouched concept
        run: |
          set -euo pipefail
          python owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py > source.log
          test "$(sha256sum owl172-run295-evidence/young-isolated-white-background-input-NO_3D.png | cut -d' ' -f1)" = 6ec346e5b02411f9509fd364db748c23a58075aeec461ef7424adcc4d893bc77
          mkdir -p owl172-run317-evidence/reference
          cp -r owl172-run295-evidence/. owl172-run317-evidence/reference/
      - name: Real official SF3D UI Run and native GLB GET from observed visible model
        timeout-minutes: 7
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run317-stability-real-native-webgl-capture-NO_RELEASE.py | tee owl172-run317-evidence/generation_actual_stdout.log
      - name: Real Chromium 390x780 WebGL2 3-view GLB QA, only if authentic GLB acquired
        if: always()
        timeout-minutes: 6
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -uo pipefail
          npm install --no-audit --no-fund --no-save playwright-core@1.58.2 three@0.170.0 pngjs@7.0.0
          for f in owl172-run317-evidence/*REAL_UNREVIEWED_NO_RELEASE.glb; do
            if test -s "$f"; then
              node owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs "$f" >owl172-run317-evidence/webgl2_real_output.log 2>&1 || echo WEBGL2_FAIL >owl172-run317-evidence/WEBGL2_HOLD.txt
              if test -d owl172-run292-browser-evidence; then
                mkdir -p owl172-run317-evidence/real_webgl2
                cp -r owl172-run292-browser-evidence/. owl172-run317-evidence/real_webgl2/
              fi
            fi
          done
      - name: Hash all actual files / strict non-release gate
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('owl172-run317-evidence');p.mkdir(exist_ok=True)
          (p/'NO_RELEASE.txt').write_text('No approved pet: independent genuine real mesh still needs art, rights, real phone QA. NO RELEASE.\n')
          d=[{'path':str(f.relative_to(p)),'bytes':f.stat().st_size,
             'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(p.rglob('*'))
             if f.is_file() and f.name not in ('file_hashes.json','SHA256SUMS.txt')]
          (p/'file_hashes.json').write_text(json.dumps(d,indent=2)+'\n')
          (p/'SHA256SUMS.txt').write_text('\n'.join(x['sha256']+'  '+x['path'] for x in d)+'\n')
          print('files',len(d),'native',len(list(p.glob('*.glb'))))
          PY
          (cd owl172-run317-evidence && sha256sum -c SHA256SUMS.txt)
      - name: Upload research artifact, not public pet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run317-actual-SF3D-native-real-webgl-RESEARCH-NO_RELEASE
          path: owl172-run317-evidence/
          retention-days: 14
          if-no-files-found: warn
