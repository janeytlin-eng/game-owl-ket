name: owl172 Run152 native orientation PBR art test NO_RELEASE
on:
  push:
    branches: [research/owl172-run152-orientation-controlled-true-pbr-audit]
    paths:
      - .github/workflows/owl-pet-172-run152-anatomical-camera-pbr.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run152_orientation_pbr_audit.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  test-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run152-orientation-controlled-true-pbr-audit
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run151-CLEAN-ALPHA-NEURAL-NO_RELEASE/run151_status.json
            owl-pet/3d-experiments/172-tyto-castanops/tools/run152_orientation_pbr_audit.py
            .github/workflows/owl-pet-172-run152-anatomical-camera-pbr.yml
      - name: Preflight and fetch genuine Run151 research model artifact
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run152-ORIENTATION-PBR-NO_RELEASE"
          mkdir -p "$O"
          test -s owl-pet/AGENTS.md
          grep -q 'AGE-UNKNOWN MESOPTILE' owl-pet/research/species/172-tyto-castanops-v3.md
          python3 -m py_compile "$R/tools/run152_orientation_pbr_audit.py"
          python3 - <<'PY'
          import json,pathlib
          r=pathlib.Path("owl-pet/3d-experiments/172-tyto-castanops")
          d=json.loads((r/"research-evidence-run151-CLEAN-ALPHA-NEURAL-NO_RELEASE/run151_status.json").read_text())
          pin="f05ad553ebf00a495a4f1593ca2a1949a277ad98ecdd334cb4a75d7283bbec76"
          assert d["chosen_glb"]["sha256"]==pin and not d["art_approved"]
          reg=json.loads((r/"known_rejected_asset_sha256_registry.json").read_text())
          assert pin not in {v["sha256"] for v in reg["known_rejected_source_glbs"]}
          PY
          gh run list -R "$GITHUB_REPOSITORY" -w owl-pet-172-run151-clean-alpha-neural.yml -b research/owl172-run151-clean-alpha-neural-multiview-gate -L 12 --json databaseId,conclusion,createdAt > "$O/run152_source_runs.json"
          ID=$(python3 - "$O/run152_source_runs.json" <<'PY'
          import json,sys
          runs=json.load(open(sys.argv[1]))
          print(next((r["databaseId"] for r in runs if r.get("conclusion")=="success"),""))
          PY
          )
          test -n "$ID"
          echo "$ID" > "$O/run152_source_run_id.txt"
          gh run download "$ID" -R "$GITHUB_REPOSITORY" -n owl172-run151-clean-alpha-neural-real-NO_RELEASE -D "$O" > "$O/run152_download.log" 2>&1
          echo "f05ad553ebf00a495a4f1593ca2a1949a277ad98ecdd334cb4a75d7283bbec76  $O/run151_original_RESEARCH_ONLY.glb" | sha256sum -c - > "$O/run152_verified_model_sha.log"
      - name: Run Blender native corrected-front baseline and cosmetic PBR experiment
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run152-ORIENTATION-PBR-NO_RELEASE"
          if [ ! -s "$O/run151_original_RESEARCH_ONLY.glb" ]; then echo 'NO_MODEL: no native render asserted' > "$O/run152_native_SKIPPED.txt"; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-pil python3-numpy
          blender -b -t 2 --python-exit-code 7 -P "$R/tools/run152_orientation_pbr_audit.py" -- render 2>&1 | tee "$O/run152_blender_actual.log"
      - name: Create contact sheet only with eight actual renders
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          o=Path("owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run152-ORIENTATION-PBR-NO_RELEASE")
          views=("front","quarter","side","back");var=("original","toned")
          paths=[o/f"run152_{v}_{k}_ACTUAL_CYCLES_UNAPPROVED.png" for k in views for v in var]
          if all(x.exists() and x.stat().st_size>1000 for x in paths):
            im=Image.new("RGB",(960,1920),"#dde0e4");draw=ImageDraw.Draw(im)
            for i,k in enumerate(views):
              for j,v in enumerate(var):
                im.paste(Image.open(o/f"run152_{v}_{k}_ACTUAL_CYCLES_UNAPPROVED.png").convert("RGB"),(480*j,480*i))
                draw.text((480*j+13,480*i+12),f"anatomical {k}: {v}",fill=(0,0,0))
            im.save(o/"run152_native_comparison_actual_UNAPPROVED.jpg",quality=85)
          else:(o/"run152_eightviews_NOT_CONFIRMED.txt").write_text("Missing true Blender render: no art QA assertion")
          PY
      - name: Integrity and no release
        if: always()
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run152-ORIENTATION-PBR-NO_RELEASE
          mkdir -p "$O"
          echo 'NO_RELEASE: PBR ablation only. Juvenile anatomy, real down, rights, real mobile GPU not approved; $0 spent.' > "$O/NO_RELEASE.flag"
          (cd "$O"; find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O"; sha256sum -c SHA256SUMS.txt > checksum_verification.log)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run152-native-PBR-research-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run152-ORIENTATION-PBR-NO_RELEASE
          retention-days: 30
      - name: Archive evidence on research branch only
        if: always()
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run152-ORIENTATION-PBR-NO_RELEASE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse "$O"
          git diff --cached --name-only | grep -Ei "\\.(glb|fbx|blend|obj|zip)$" | xargs -r git restore --staged --
          # All third-party GLBs stay only in the 30-day Actions artifact
          git diff --cached --name-only >/tmp/paths
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run152-' /tmp/paths; then exit 12; fi
          if ! git diff --cached --quiet; then
            git commit -m "research(owl172): archive true Run152 camera and PBR experiment NO_RELEASE"
            git push origin HEAD:research/owl172-run152-orientation-controlled-true-pbr-audit
          fi
