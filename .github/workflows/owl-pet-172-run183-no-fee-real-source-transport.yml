name: owl172 Run183 actual no-fee juvenile-source license+GLB transport gate NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run183-free-juvenile-source-transport-audit
    paths:
      - .github/workflows/owl-pet-172-run183-no-fee-real-source-transport.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run183_free_juvenile_source_probe.py
permissions:
  contents: write
jobs:
  actual-source-transports:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run183-free-juvenile-source-transport-audit
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run181-independent-sevenaxis-art-review-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run182-new-highdetail-cc0-source-native-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run183_free_juvenile_source_probe.py
      - name: Verify input, actual HTTP, real GLB geometry; $0 no installation
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          ROOT=owl-pet/3d-experiments/172-tyto-castanops
          python3 -m py_compile "$ROOT/tools/run183_free_juvenile_source_probe.py"
          python3 -u "$ROOT/tools/run183_free_juvenile_source_probe.py" 2>&1 | tee "$ROOT/run183_execution_stdout.log"
      - name: Hash actual raw source evidence and add reject audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run183-FREE-JUVENILE-SOURCE-NO_RELEASE"
          mkdir -p "$O"
          if [ -f "$R/run183_execution_stdout.log" ]; then cp "$R/run183_execution_stdout.log" "$O/run183_execution_stdout.log"; fi
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=pathlib.Path("owl-pet/3d-experiments/172-tyto-castanops")
          o=r/"research-evidence-run183-FREE-JUVENILE-SOURCE-NO_RELEASE"
          result=json.loads((o/"run183_results.json").read_text()) if (o/"run183_results.json").exists() else {"run":183,"conclusion":"PROBE_NOT_COMPLETED","art_decision":"NO_RELEASE"}
          m={}
          for f in sorted(o.iterdir()):
           if f.is_file() and f.name!="run183_sha256_manifest.json":
            m[f.name]={"bytes":f.stat().st_size,"sha256":hashlib.sha256(f.read_bytes()).hexdigest()}
          (o/"run183_sha256_manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          assert all(hashlib.sha256((o/k).read_bytes()).hexdigest()==v["sha256"] for k,v in m.items())
          rows=["# #172 Tyto castanops v3 — Run183 actual free source transport, no release","",
           "**NO_RELEASE. Real completed actions are judged from machine evidence; do not mistake source donor for a finished baby owl.**","",
           "Before execution: re-read AGENTS, owl-pet README and prototype, v3 right-hand cream mesoptile design, Run181 visual rejection, Run182 cancelled-apt audit and known reject SHA list. Original source crop SHA is fixed in live script.",
           "Run182 was **cancelled after 28 minutes of attempted apt Blender install**, before any HTTP source fetch. Run183 deliberately removes apt/Blender to separate network/rights/real-geometry validation from costly optional rendering.",
           "",
           "## Actual live probes"]
          for x in result.get("sources",[]):
           rows.append("- **"+str(x.get("label"))+"**: HTTP="+str(x.get("http_status","none"))+
            "; result="+str(x.get("result"))+"; size="+str(x.get("size_bytes","not obtained"))+
            "; SHA256="+str(x.get("sha256","not obtained"))+
            "; gltf="+json.dumps(x.get("gltf",{}),ensure_ascii=False)+
            "; error="+str(x.get("error","none")))
          rows+=["","If Grab3D bytes are downloaded, it remains an **adult great-horned owl**, neither the Tyto taxon nor the v3 cream downed juvenile; no amount of successful GLB parsing changes that fact.",
           "CGTrader Baby Owl Sculpt is a candidate for source inspection only; a listing marked free is not a verified authorized direct download, anatomical match, license transfer or image-model quality pass.",
           "BlenderKit Baby Owl Animated is **Full Plan** per its public listing; purchasing or bypassing account checks is prohibited. Never treat paid/full-plan metadata as free assets.",
           "","No GLB presented as target; no native multiview Blender render, no physical mobile phone GPU check, no release. No paid account actions or spend.",
           "Raw JSON, source HTTP excerpts, license (if received), downloaded adult GLB (if received, isolated 30-day artifact only), logs and SHA256 manifest preserved.",
           "Only #172 research directory and standalone workflow changed. Main/prototype/251 species workflow/deployment untouched.",
           "",
           "**Final gate: "+str(result.get("conclusion","PROBE_NOT_COMPLETED"))+" / NO_RELEASE.**"]
          (r/"2026-11-18-run183-real-free-juvenile-source-transport-NO_RELEASE.md").write_text("\n".join(rows)+"\n")
          print("RUN183_EVIDENCE",result.get("conclusion"),len(m))
          PY
      - name: Preserve actual source artifact, including real GLB if obtained, isolated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run183-real-free-juvenile-source-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run183-FREE-JUVENILE-SOURCE-NO_RELEASE/
          retention-days: 30
      - name: Commit only independent audit and evidence, never binary GLB
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run183-FREE-JUVENILE-SOURCE-NO_RELEASE"
          git add --sparse "$R/2026-11-18-run183-real-free-juvenile-source-transport-NO_RELEASE.md"
          find "$O" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.json' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only >/tmp/changed_run183.txt
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/changed_run183.txt; then exit 90; fi
          if grep -Ei '\.(glb|fbx|blend|obj|zip|bin)$' /tmp/changed_run183.txt; then exit 91; fi
          if [ -s /tmp/changed_run183.txt ]; then
            git commit -m 'research(owl172): archive actual free source transport, license and rejection gate'
            git push origin HEAD:research/owl172-run183-free-juvenile-source-transport-audit
          fi
