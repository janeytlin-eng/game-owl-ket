name: owl172 Run173 free keyless TRELLIS text-3D native QA NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run173-threews-free-text-neural-source-gate
    paths:
      - .github/workflows/owl-pet-172-run173-threews-free-text-3d.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run173_threews_free_text.py
permissions:
  contents: write
jobs:
  free-truly-native-threews:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run173-threews-free-text-neural-source-gate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/owl-pet-172-run173-threews-free-text-3d.yml
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run169-source-calibrated-vtk-native-sixview-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run173_threews_free_text.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reference, model hashes and install no-fee real mesh QA
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run173-THREEWS-FREE-TEXT-NO_RELEASE"
          mkdir -p "$O"
          for x in owl-pet/AGENTS.md owl-pet/README.md owl-pet/prototype/index.html owl-pet/research/species/172-tyto-castanops-v3.md; do test -s "$x"; done
          echo "5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9  $R/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png" | sha256sum -c | tee "$O/preflight_hash.log"
          python -m json.tool "$R/known_rejected_asset_sha256_registry.json" >/dev/null
          grep -q 'ART_REJECTED' "$R/2026-11-18-run169-source-calibrated-vtk-native-sixview-ART_REJECTED-NO_RELEASE.md"
          python -m py_compile "$R/tools/run173_threews_free_text.py"
          python -m pip install --disable-pip-version-check -q requests numpy pillow trimesh 'vtk==9.6.2' > "$O/deps-install.log" 2>&1
          python -c 'import trimesh,vtk;print("trimesh",trimesh.__version__,"VTK",vtk.vtkVersion.GetVTKVersion())' | tee -a "$O/deps-install.log"
      - name: Actual single free keyless 3D generation and native six angle QA
        timeout-minutes: 13
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run173-THREEWS-FREE-TEXT-NO_RELEASE"
          timeout 720s python -u "$R/tools/run173_threews_free_text.py" 2>&1 | tee "$O/run173_live.log"
      - name: Independent audit and SHA256 evidence verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          r=Path("owl-pet/3d-experiments/172-tyto-castanops")
          o=r/"research-evidence-run173-THREEWS-FREE-TEXT-NO_RELEASE"
          o.mkdir(parents=True,exist_ok=True)
          state=o/"run173_actual_results.json"
          d=json.loads(state.read_text()) if state.exists() else {}
          (o/"NO_RELEASE.flag").write_text("NO_RELEASE: new text geometry is not art-approved, does not reconstruct actual reference, no real phone WebGL GPU test. Zero payments.\n")
          manifest={p.name:{"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(o.iterdir()) if p.is_file() and p.name!="run173_sha256_manifest.json"}
          (o/"run173_sha256_manifest.json").write_text(json.dumps(manifest,indent=2))
          assert all(hashlib.sha256((o/k).read_bytes()).hexdigest()==v["sha256"] for k,v in manifest.items())
          status=d.get("status","NOT_EXECUTED")
          count=len(d.get("new_valid_glb",[]))
          render=d.get("native_qa",{}).get("renderer","NOT_EXECUTED")
          lines=[
            "# Run173: independent free text-to-3D source and real native export QA",
            "",
            "**NO_RELEASE / ART_NOT_APPROVED.** Date 2026-11-18. Research branch only.",
            "",
            "Rechecked owl-pet AGENTS.md, README.md, WebGL prototype, Tyto castanops v3 rightmost cream mesoptile design boundary, Run169 native six-angle art rejection and rejected SHA registry. Exact rightmost reference image SHA256: 5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9.",
            "",
            "Actual new provider: https://three.ws/docs/3d-api . Consulted advertised free keyless API and submitted ONLY one request to the free text-to-3D endpoint POST /api/3d/generate. Never contacted paid Forge, rigging or x402, never paid. This route is deliberately TEXT-TO-3D, not a reconstruction from the target reference PNG; even a generated GLB cannot be labeled the original rightmost character.",
            "",
            "Actual provider/run status: **"+status+"**.",
            "Verified new native substantial GLBs: **"+str(count)+"**. Actual native VTK renderer: **"+render+"**. Phone GPU/WebGL physical device: **NOT TESTED**. Scientific/art acceptance: **NOT PASSED**. Additional spending: **$0**.",
            "",
            "Live HTTP responses, source checks, execution logs, structured result JSON, native GLB metrics and multi-axis PNG evidence if successful, NO_RELEASE marker and verified SHA256 manifest archived under research-evidence-run173-THREEWS-FREE-TEXT-NO_RELEASE. Evidence items: "+str(len(manifest))+". Any native GLB remains only in quarantined 30-day GitHub Actions artifact, NOT committed or deployed.",
            "",
            "No approximation with SVG, primitive toy geometry, rejected adult owl or false target-image provenance counts as success. Further gate: true natural cream down, integrated heart disc, accurate side and back, short hidden wings, concealed tail, hollow lip, legal provenance, mobile WebGL. Incomplete means NO_RELEASE.",
            "",
            "Scope limited to #172 isolated research directory and unique dedicated workflow. No changes to main, 251 species production, existing prototype or deployment.",
            "",
            "**FINAL NO_RELEASE.**"
          ]
          (r/"2026-11-18-run173-threews-free-text-native-gate-NO_RELEASE.md").write_text("\n".join(lines)+"\n")
          print("RUN173_AUDIT",status,"GLB",count,"EVIDENCE",len(manifest))
          PY
      - name: Upload real evidence and quarantined native GLB as isolated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run173-threews-free-true3d-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run173-THREEWS-FREE-TEXT-NO_RELEASE/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit only text evidence and native screenshots never model binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run173-THREEWS-FREE-TEXT-NO_RELEASE"
          git add --sparse "$R/2026-11-18-run173-threews-free-text-native-gate-NO_RELEASE.md"
          find "$O" -maxdepth 1 -type f \( -name '*.json' -o -name '*.png' -o -name '*.txt' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only >/tmp/run173_staged
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/run173_staged; then exit 90; fi
          if grep -Ei '\.(glb|blend|zip|fbx|obj|bin)$' /tmp/run173_staged; then exit 91; fi
          if [ -s /tmp/run173_staged ]; then
            git commit -m 'research(owl172): archive real no-fee Run173 3D evidence NO_RELEASE'
            git push origin HEAD:research/owl172-run173-threews-free-text-neural-source-gate
          fi
