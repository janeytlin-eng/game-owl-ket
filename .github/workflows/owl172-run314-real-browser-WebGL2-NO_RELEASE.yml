name: Owl172 Run314 native GLB Chromium WebGL2 A-B research — NO RELEASE
on:
  push:
    branches:
      - research/owl172-run314-curved-down-feather-card-AB-REJECTED-NO_RELEASE
    paths:
      - '.github/workflows/owl172-run314-real-browser-WebGL2-NO_RELEASE.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Narrow source checkout without the large production repo
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops/run314-chromium-WebGL2-A-B-research-NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run311b-original-continuous-sculpt-python-gzip-base64.md
            owl-pet/3d-experiments/172-tyto-castanops/run314-exact-curved-down-card-source-gzip-base64.md
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero paid modeler, VTK virtual display, Chromium, and Three.js
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1-mesa-dri xvfb
          python -m pip install --disable-pip-version-check --no-cache-dir numpy scipy scikit-image trimesh vtk pillow playwright
          python -m playwright install --with-deps chromium
          npm init -y
          npm install --no-audit --no-fund three@0.180.0
      - name: Recover previously audited exact original source and SHA gate
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,re,gzip,base64,hashlib
          folder=pathlib.Path('owl-pet/3d-experiments/172-tyto-castanops')
          jobs=[('run311b-original-continuous-sculpt-python-gzip-base64.md','sculpt_run311b.py',13008,'9e630af2b50b86709cbbf878a41b6e8a8beb45de97c1453902f98699aa56ecf5'),
                ('run314-exact-curved-down-card-source-gzip-base64.md','groom_A.py',5656,'e4b46fa8a178146dabfd6145a4a565aab3e95bd37a394e8e340b8ae195c51e9c')]
          for md,py,sz,sha in jobs:
            m=re.search(r'(?s)\x60\x60\x60base64\s+([A-Za-z0-9+/=\s]+?)\s+\x60\x60\x60',(folder/md).read_text())
            assert m,md
            b=gzip.decompress(base64.b64decode(''.join(m.group(1).split())))
            assert len(b)==sz and hashlib.sha256(b).hexdigest()==sha,md
            pathlib.Path(py).write_bytes(b)
            print('Verified exact original source',py,sz,sha)
          PY
          python -m py_compile sculpt_run311b.py groom_A.py
      - name: Actually reproduce original rejected 3D mesh and both newly groomed research GLBs
        shell: bash
        env:
          OWL_OUT: /tmp/owl172_run314_browser_base
        run: |
          set -o pipefail
          mkdir -p "$OWL_OUT" research/A research/B
          xvfb-run -a -s "-screen 0 1280x1024x24" python sculpt_run311b.py 2>&1 | tee /tmp/rebuild.log
          python groom_A.py --src "$OWL_OUT/owl172_run311b_original_sculpt_RESEARCH_ONLY.glb" --count 6500 --out research/A | tee /tmp/groomA.log
          cp groom_A.py groom_B.py
          sed -i 's/length_factor=.026, width_factor=.0035/length_factor=.05, width_factor=.007/' groom_B.py
          sed -i 's/np.clip(a\*178/np.clip(a*230/' groom_B.py
          python groom_B.py --src "$OWL_OUT/owl172_run311b_original_sculpt_RESEARCH_ONLY.glb" --count 14000 --out research/B | tee /tmp/groomB.log
      - name: Independently reimport both genuine GLBs before Chromium
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,hashlib,trimesh
          for v,count in [('A',6500),('B',14000)]:
            f=pathlib.Path('research')/v/f'run314_curved_down_{count}_RESEARCH_ONLY_NO_RELEASE.glb'
            b=f.read_bytes();assert b[:4]==b'glTF' and len(b)>1000000
            s=trimesh.load(f,force='scene',process=False)
            tris=sum(len(g.faces) for g in s.geometry.values())
            assert len(s.geometry)>=27 and tris>80000,(v,len(s.geometry),tris)
            print('NATIVE',v,len(b),hashlib.sha256(b).hexdigest(),len(s.geometry),tris)
          PY
      - name: Verify corrected original Y-up / Z-front true-anatomical camera code
        run: |
          python - <<'PY'
          import hashlib,pathlib
          f=pathlib.Path('owl-pet/3d-experiments/172-tyto-castanops/run314-chromium-WebGL2-A-B-research-NO_RELEASE.py')
          t=f.read_text()
          assert 'camera.up.set(0,1,0)' in t and 'camera.position.set(Math.sin(a)*dist,dist*.20,Math.cos(a)*dist)' in t
          h=hashlib.sha256(f.read_bytes()).hexdigest()
          assert h=='b4a8b108a927a5fcde35afdb4b072a85aec6484852a933dd5175654b068ef4e6',h
          print('Correct anatomical camera orientation and source SHA verified',h)
          PY
      - name: Actual Chromium WebGL2 loader and six different spatial angles
        shell: bash
        env:
          OWL314_BROWSER_OUT: /tmp/owl172_run314_browser
          OWL314_HOST: http://127.0.0.1:8765
        run: |
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('owl-pet/3d-experiments/172-tyto-castanops/run314-chromium-WebGL2-A-B-research-NO_RELEASE.py')
          m=ast.parse(p.read_text())
          n=next(x.value for x in m.body if isinstance(x,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='HTML' for t in x.targets))
          pathlib.Path('run314_view.html').write_text(ast.literal_eval(n))
          PY
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/http_server.log 2>&1 &
          sleep 2
          set -o pipefail
          python owl-pet/3d-experiments/172-tyto-castanops/run314-chromium-WebGL2-A-B-research-NO_RELEASE.py | tee /tmp/browser_execution.log
          cp /tmp/browser_execution.log /tmp/owl172_run314_browser/browser_execution.log
          cp /tmp/http_server.log /tmp/owl172_run314_browser/http_server.log
      - name: Archive only non-released browser research screenshots and actual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run314-browser-A-B-real-WebGL2-ART_REJECTED-NO_RELEASE
          path: /tmp/owl172_run314_browser
          retention-days: 14
          if-no-files-found: warn
