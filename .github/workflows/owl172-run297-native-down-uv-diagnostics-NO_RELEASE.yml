name: "#172 Run297 native 3D down-feather and actual WebGL2 diagnostic - NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run297-native-down-uv-diagnostics-ART_REJECTED-NO_RELEASE
    paths:
      - '.github/workflows/owl172-run297-native-down-uv-diagnostics-NO_RELEASE.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run297_real_mesh_down_cards_experiment_NO_RELEASE.py'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run297b_real_mesh_UV_atlas_experiment_NO_RELEASE.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent_native_geometry_material_and_webgl2_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops/run297_real_mesh_down_cards_experiment_NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run297b_real_mesh_UV_atlas_experiment_NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run292_browser_viewer_uncropped_NO_RELEASE.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve Run296 exact original real native GLB and verified source pixels; no new provider cost
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45032367201 -R janeytlin-eng/game-owl-ket -n owl172-run296-user-real-cream-juvenile-source-free-native3d-NO_RELEASE -D owl172-run297-upstream
          test -s owl172-run297-upstream/actual-chick-clean-input-native-UNAPPROVED.glb
          test -s owl172-run297-upstream/input-provenance/young-isolated-white-background-input-NO_3D.png
          echo '99af9d7e227ea73993a92762adc87c7fab29c39c3f92bd398cebda984e363bab  owl172-run297-upstream/actual-chick-clean-input-native-UNAPPROVED.glb' | sha256sum -c -
          echo '6ec346e5b02411f9509fd364db748c23a58075aeec461ef7424adcc4d893bc77  owl172-run297-upstream/input-provenance/young-isolated-white-background-input-NO_3D.png' | sha256sum -c -
      - name: Actually produce and reopen two different true 3D GLBs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy Pillow trimesh
          mkdir -p owl172-run297-evidence
          python owl-pet/3d-experiments/172-tyto-castanops/run297_real_mesh_down_cards_experiment_NO_RELEASE.py \
            --glb owl172-run297-upstream/actual-chick-clean-input-native-UNAPPROVED.glb \
            --photo owl172-run297-upstream/input-provenance/young-isolated-white-background-input-NO_3D.png \
            --out owl172-run297-evidence --tufts 9000 | tee owl172-run297-evidence/run297-generation-log.txt
          python owl-pet/3d-experiments/172-tyto-castanops/run297b_real_mesh_UV_atlas_experiment_NO_RELEASE.py \
            owl172-run297-evidence/run297-real-owl-with-down-UNAPPROVED.glb \
            owl172-run297-upstream/input-provenance/young-isolated-white-background-input-NO_3D.png \
            owl172-run297-evidence | tee owl172-run297-evidence/run297b-generation-log.txt
      - name: Actual 390x780 Chromium software WebGL2 three spatial views for both GLBs
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright-core@1.58.2 three@0.170.0 pngjs@7.0.0
          node owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs \
            owl172-run297-evidence/run297-real-owl-with-down-UNAPPROVED.glb \
            owl172-run297-evidence/run297b-real-owl-UV-fur-UNAPPROVED.glb \
            | tee owl172-run297-evidence/run297-browser-log.txt
          cp -r owl172-run292-browser-evidence owl172-run297-evidence/chrome-390x780
      - name: Strict independent no-release manifest and checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owl172-run297-evidence
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          o=Path('owl172-run297-evidence')
          report={'species':'#172 Tyto castanops v3 mesoptile','real_mesh_feather_diagnostic':True,
              'art_approved':False,'rights_cleared':False,'physical_phone_tested':False,
              'release_allowed':False,'warning':'Software WebGL2 or distinct cameras do not establish sculpt, feather, wing, side, rear quality.'}
          (o/'STRICT_ART_RIGHTS_PHONE_NO_RELEASE.json').write_text(json.dumps(report,indent=2))
          lines=[]
          for p in sorted(o.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS.txt':
                  lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(o)))
          (o/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print('Hashed',len(lines),'research files')
          PY
          (cd owl172-run297-evidence && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run297-two-real-glb-real-chrome-NO_RELEASE
          path: owl172-run297-evidence/
          retention-days: 14
          if-no-files-found: warn
