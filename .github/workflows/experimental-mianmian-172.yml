name: "EXPERIMENT ONLY - Mianmian #172 source reference QA"
on:
  push:
    branches:
      - experiments/mianmian-172-reference-qa
    paths:
      - .github/workflows/experimental-mianmian-172.yml
      - owl-pet/3d-experiments/172-tyto-castanops/run07/extract_reference.py
      - owl-pet/3d-experiments/172-tyto-castanops/run07/test_rembg_matte.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-mianmian-172-reference-qa
  cancel-in-progress: false
jobs:
  source-crop-not-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout original concept and isolated experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/design/concepts/172-tyto-castanops-v3.png
            owl-pet/3d-experiments/172-tyto-castanops/run07/
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install basic image processing dependencies (no paid models)
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless rembg onnxruntime
      - name: Verify original and extract rightmost chick crop and matte
        run: |
          set -euo pipefail
          test "$(wc -c < owl-pet/design/concepts/172-tyto-castanops-v3.png)" = 737545
          python owl-pet/3d-experiments/172-tyto-castanops/run07/extract_reference.py \
            --source owl-pet/design/concepts/172-tyto-castanops-v3.png \
            --out owl-pet/3d-experiments/172-tyto-castanops/run07/output \
            | tee owl-pet/3d-experiments/172-tyto-castanops/run07/last_run_stdout.json
      - name: Compare optional free CPU saliency matte (no 3D generation)
        continue-on-error: true
        timeout-minutes: 7
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run07/test_rembg_matte.py \
            --output-dir owl-pet/3d-experiments/172-tyto-castanops/run07/output \
            | tee owl-pet/3d-experiments/172-tyto-castanops/run07/rembg_stdout.json
      - name: Retain rejected/unchecked reference products in action artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mianmian172-run07-reference-qa-unapproved
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run07/output/
            owl-pet/3d-experiments/172-tyto-castanops/run07/last_run_stdout.json
            owl-pet/3d-experiments/172-tyto-castanops/run07/rembg_stdout.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit QA outputs on isolated branch only
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owl-pet/3d-experiments/172-tyto-castanops/run07/output \
                  owl-pet/3d-experiments/172-tyto-castanops/run07/last_run_stdout.json
                  owl-pet/3d-experiments/172-tyto-castanops/run07/rembg_stdout.json
          if git diff --cached --quiet; then
            echo "Reference outputs unchanged."
          else
            git commit -m "experiments(#172): archive unapproved source-driven chick extraction and QA"
            git push origin HEAD:experiments/mianmian-172-reference-qa
          fi
