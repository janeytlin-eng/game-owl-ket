name: owl172 Run140 real textured GLB LOD and software-mobile WebGL QA strict NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run140-actual-textured-glb-lod-webgl2
    paths:
      - .github/workflows/owl-pet-172-run140-actual-textured-lod-webgl.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run140_lod_mobile_qa.py
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  real-textured-model-simulated-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run140-actual-textured-glb-lod-webgl2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/owl-pet-172-run140-actual-textured-lod-webgl.yml
            owl-pet/3d-experiments/172-tyto-castanops/tools/run140_lod_mobile_qa.py
      - name: Acquire actual Run139 original 192765-triangle model, not an imitation
        uses: actions/download-artifact@v4
        with:
          name: owl172-run139-alternate-real-no-fee-RESEARCH-NO_RELEASE
          run-id: 44066390229
          github-token: ${{ github.token }}
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140-PBR-LOD-SIMULATED-MOBILE-NO_RELEASE
      - name: Pin actual source and create two real textured mesh LODs with Blender
        id: lod
        continue-on-error: true
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run140-PBR-LOD-SIMULATED-MOBILE-NO_RELEASE"
          test -s "$O/run139_original_RESEARCH_ONLY.glb"
          echo '9a154c9e3aeebb34ebcd6f209760e1d9e21e2f544f2b690dae406d9c8bf878e8  '"$O/run139_original_RESEARCH_ONLY.glb" | sha256sum -c
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b -t 2 -P "$R/tools/run140_lod_mobile_qa.py" -- lod 2>&1 | tee "$O/run140_real_blender_lod.log"
      - name: Real loaded full and LOD models in software WebGL2 mobile viewport and desktop
        id: browser
        if: always()
        continue-on-error: true
        shell: bash
        timeout-minutes: 11
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run140-PBR-LOD-SIMULATED-MOBILE-NO_RELEASE"
          test -s "$O/run139_original_RESEARCH_ONLY.glb"
          node -v
          npm install --no-save --no-audit --no-fund three@0.169.0
          python3 -m pip install --break-system-packages -q 'playwright>=1.48,<2'
          python3 -m playwright install --with-deps chromium
          python3 "$R/tools/run140_lod_mobile_qa.py" browser 2>&1 | tee "$O/run140_actual_browser.log"
      - name: Verify evidence and strict quarantine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140-PBR-LOD-SIMULATED-MOBILE-NO_RELEASE
          mkdir -p "$O"
          echo 'NO_RELEASE: 4-view source art rejected. GLBs are research-only; physical GPU, rights and final art not approved. Software WebGL viewport simulation is not physical phone.' > "$O/NO_RELEASE.flag"
          printf 'lod=%s\nbrowser=%s\n' "${{ steps.lod.outcome }}" "${{ steps.browser.outcome }}" > "$O/run140_steps.txt"
          (cd "$O" && find . -type f ! -name SHA256SUMS.txt ! -name checksum_verification.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$O" && sha256sum -c SHA256SUMS.txt > checksum_verification.log)
          test -s "$O/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run140-real-textured-lod-software-webgl-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140-PBR-LOD-SIMULATED-MOBILE-NO_RELEASE
          retention-days: 30
      - name: Commit only nonbinary evidence to independent research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140-PBR-LOD-SIMULATED-MOBILE-NO_RELEASE
          git add --sparse "$O"
          git restore --staged -- "$O"/*.glb 2>/dev/null || true
          git diff --cached --name-only > /tmp/run140_changed
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run140-' /tmp/run140_changed; then echo SCOPE_VIOLATION; exit 9; fi
          if ! git diff --cached --quiet; then
            git commit -m "research(owl172): archive Run140 actual textured native LOD and mobile viewport WebGL checks"
            git push origin HEAD:research/owl172-run140-actual-textured-glb-lod-webgl2
          fi
