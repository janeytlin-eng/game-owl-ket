name: "owl172 Run304 real free Hi3D textured native GLB NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run304-hi3d-normal-free-textured-native-NO_RELEASE
    paths:
      - '.github/workflows/owl172-run304-hi3d-normal-free-texture-NO_RELEASE.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run304_real_hi3d_browser_NO_RELEASE.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_browser_provider_native3d_research:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/design/concepts/172-tyto-castanops-v3.png
            owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run304_real_hi3d_browser_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run292_browser_viewer_uncropped_NO_RELEASE.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate exact rightmost #172 juvenile reference
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy opencv-python-headless trimesh
          python owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py | tee run304-source-log.txt
          cp owl172-run295-evidence/young-isolated-white-background-input-NO_3D.png target-owl172-isolated-WHITE.png
          test "$(sha256sum target-owl172-isolated-WHITE.png | cut -d' ' -f1)" = 6ec346e5b02411f9509fd364db748c23a58075aeec461ef7424adcc4d893bc77
          mkdir -p owl172-run304-evidence/reference
          cp target-owl172-isolated-WHITE.png owl172-run304-evidence/reference/
          cp run304-source-log.txt owl172-run304-evidence/
      - name: One REAL site generation attempt only if a working FREE control exists
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.58.2 three@0.170.0 pngjs@7.0.0
          node --check owl-pet/3d-experiments/172-tyto-castanops/run304_real_hi3d_browser_NO_RELEASE.mjs
          node owl-pet/3d-experiments/172-tyto-castanops/run304_real_hi3d_browser_NO_RELEASE.mjs | tee owl172-run304-evidence/browser-stdout.txt
      - name: Independent actual GLB Trimesh and real Three.js WebGL2 only if model captured
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          mkdir -p owl172-run304-evidence
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('owl172-run304-evidence');f=p/'run304-hi3d-native-real-NOT_APPROVED.glb'
          r={'native_found':f.exists(),'art_approved':False,'rights_cleared':False,
             'physical_phone_tested':False,'release_allowed':False}
          if f.exists():
              try:
                  import trimesh
                  s=trimesh.load(f,force='scene')
                  m=list(s.geometry.values())
                  r.update(bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest(),
                           triangle_count=sum(len(x.faces) for x in m),geometries=len(m),
                           texture_kinds=[x.visual.kind for x in m])
                  assert r['triangle_count']>=1000
              except Exception as e:r['native_inspect_error']=str(e)
          (p/'independent-native-gate.json').write_text(json.dumps(r,indent=2))
          print(r)
          PY
          if test -f owl172-run304-evidence/run304-hi3d-native-real-NOT_APPROVED.glb; then
             node owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs owl172-run304-evidence/run304-hi3d-native-real-NOT_APPROVED.glb >owl172-run304-evidence/webgl2-log.txt 2>&1 || echo 'WEBGL2_HOLD' >owl172-run304-evidence/WEBGL2_HOLD.flag
             if test -d owl172-run292-browser-evidence; then cp -r owl172-run292-browser-evidence owl172-run304-evidence/browser_views; fi
          fi
      - name: All evidence hashed with strict no-release marker
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('owl172-run304-evidence');p.mkdir(exist_ok=True)
          glb=p/'run304-hi3d-native-real-NOT_APPROVED.glb'
          (p/'STRICT_NO_RELEASE.json').write_text(json.dumps({'native_exists':glb.exists(),
            'art_review_approved':False,'rights_cleared':False,
            'physical_phone_tested':False,'release_allowed':False,'paid_usd':0,
            'final':'NO_RELEASE'},indent=2))
          lines=[hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(p))
           for f in sorted(p.rglob('*')) if f.is_file() and f.name!='SHA256SUMS.txt']
          (p/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print('Evidence objects',len(lines),'native GLB exists',glb.exists())
          PY
          (cd owl172-run304-evidence && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run304-hi3d-real-chromium-native3d-RESEARCH-NO_RELEASE
          path: owl172-run304-evidence/
          retention-days: 14
          if-no-files-found: warn
