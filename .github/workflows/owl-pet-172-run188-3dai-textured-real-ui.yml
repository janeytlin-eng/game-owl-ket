name: owl172 Run188 no-account free textured image-conditioned native GLB UI attempt NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run188-3dai-free-textured-source-bound
    paths:
      - .github/workflows/owl-pet-172-run188-3dai-textured-real-ui.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run188_3dai_free_textured_browser.py
permissions:
  contents: write
jobs:
  actual-no-fee-textured-owl-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run188-3dai-free-textured-source-bound
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/AGENTS.md
            owl-pet/README.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run186-dom-submission-verified-no-new-glb-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-18-run187-actual-cc0-juvenile-native-source-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/tools/run188_3dai_free_textured_browser.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install no-fee real Chromium and browser client
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run188-3DAI-TEXTURED-REAL-UI-NO_RELEASE"
          mkdir -p "$O"
          python -m py_compile "$R/tools/run188_3dai_free_textured_browser.py"
          python -m pip install -q playwright==1.55.0 > "$O/run188_pip.log" 2>&1
          python -m playwright install chromium > "$O/run188_chromium.log" 2>&1
      - name: Upload verified original rightmost chick and actually try the free textured generate control
        continue-on-error: true
        timeout-minutes: 9
        shell: bash
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run188-3DAI-TEXTURED-REAL-UI-NO_RELEASE"
          timeout 475s python -u "$R/tools/run188_3dai_free_textured_browser.py" 2>&1 | tee "$O/run188_real_browser.log"
      - name: Source and candidate integrity audit; never art-approve without visual four-view and physical mobile GPU
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('owl-pet/3d-experiments/172-tyto-castanops')
          o=r/'research-evidence-run188-3DAI-TEXTURED-REAL-UI-NO_RELEASE'
          o.mkdir(parents=True,exist_ok=True)
          result=json.loads((o/'run188_results.json').read_text()) if (o/'run188_results.json').exists() else {}
          (o/'NO_RELEASE.flag').write_text('NO_RELEASE: model missing or art unreviewed; rights and actual-phone GPU unverified; zero paid tools.\n')
          m={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
             for p in sorted(o.iterdir()) if p.is_file() and p.name!='run188_sha256_manifest.json'}
          (o/'run188_sha256_manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          assert all(hashlib.sha256((o/name).read_bytes()).hexdigest()==v['sha256'] for name,v in m.items())
          stage='ACTUAL_SOURCE_BOUND_NATIVE_GLB_UNREVIEWED' if result.get('glb_count',0)>0 else 'NO_NEW_NATIVE_GLB'
          lines=[
           '# Run188 — 3dai.dev real one-off free textured image-to-3D interface',
           '',
           '**NO_RELEASE / '+stage+' / ART_UNREVIEWED / PHYSICAL_MOBILE_UNTESTED.**',
           '',
           'Preflight reread owl-pet original cat WebGL prototype, AGENTS/README, #172 v3 design, Run186 and Run187 outcomes and known rejected native GLB hashes.',
           'Verified rightmost source SHA256: '+str(result.get('source_sha256','UNAVAILABLE'))+'; expected 5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9.',
           'New independent free service source: https://3dai.dev/en (advertises no account, texturing with Hunyuan Paint and a legitimate GLB download). This is an isolated one-shot attempt, not an unlimited free service or a license guarantee.',
           'Actual page/image upload: '+str(result.get('upload_success',False))+'. Textured generate clicked: '+str(result.get('generate_clicked',False))+'. Actual source-bound GLB binaries: '+str(result.get('glb_count',0))+'.',
           'Exception/error if any: '+str(result.get('exception','none recorded'))[:500]+'.',
           'Actual source native files if any stay only in 30-day isolated Actions artifact; not published or automatically adopted. A model would require real raster front/45/side/back/bottom, cream airy down, heart mask open dark eyes, short buried wings and concealed tail, full feet supported on eucalypt hollow, confirmed export rights and physical mobile GPU check before an acceptance decision.',
           'Actual browser screenshots, button states, network status metadata, complete progress records, execution logs and independent SHA256 manifest were captured where possible.',
           'No payments, credit purchases, account evasion, paid external APIs, SVG stand-ins, production file edits, deployment or species pipeline changes.',
           '',
           '**FINAL NO_RELEASE.**'
          ]
          (r/'2026-11-18-run188-3dai-textured-real-native-NO_RELEASE.md').write_text('\n'.join(lines)+'\n')
          print('RUN188_EVIDENCE_HASH_OK',len(m),'STATUS',stage,flush=True)
          PY
      - name: Keep true browser evidence and any unaccepted new GLB in isolated 30-day artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run188-new-free-real-textured-browser-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run188-3DAI-TEXTURED-REAL-UI-NO_RELEASE/
          retention-days: 30
      - name: Commit only #172 text evidence and source audit, never unreviewed binary or 251-species pipeline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run188-3DAI-TEXTURED-REAL-UI-NO_RELEASE"
          git add --sparse "$R/2026-11-18-run188-3dai-textured-real-native-NO_RELEASE.md"
          find "$O" -maxdepth 1 -type f \( -name '*.txt' -o -name '*.log' -o -name '*.json' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only >/tmp/run188_changed_paths.txt
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/run188_changed_paths.txt; then exit 90; fi
          if grep -Ei '\.(glb|fbx|blend|obj|zip|bin|png)$' /tmp/run188_changed_paths.txt; then exit 91; fi
          if [ -s /tmp/run188_changed_paths.txt ]; then
            git commit -m 'research(owl172): archive one-shot genuine free textured image-to-3D UI results no release'
            git push origin HEAD:research/owl172-run188-3dai-free-textured-source-bound
          fi
