name: "#172 Run234 real museum adult Tyto cream PBR A/B — 3D ART REJECTED NO_RELEASE"
on:
  push:
    branches:
      - research/owl172-run234-museum-cream-material-real-3d-qa-no-release
    paths:
      - '.github/workflows/owl172-run234-real-museum-cream-material-qa.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run234_real_CC0_donor_cream_texture_two_variants.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cc0-mesh-pbr-material-test-no-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU mesh, raster, color and Draco tools
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libosmesa6
          python -m pip install --quiet "numpy==1.26.4" "pillow==10.4.0" "trimesh==4.4.9" "vtk==9.3.1" "scipy==1.14.1" "scikit-image==0.24.0" "requests==2.32.3"
          npm install --no-save @gltf-transform/cli@4.5.1
      - name: Fetch actual museum 3D asset from CC0-labelled Zenodo and decode Draco, check exact SHA
        run: |
          set -eu
          D=owl-pet/3d-experiments/172-tyto-castanops/run234-evidence
          mkdir -p "$D"
          python - <<'PY'
          import hashlib,pathlib,requests
          target=pathlib.Path('owl-pet/3d-experiments/172-tyto-castanops/run234-evidence/donor_draco_adult.glb')
          url='https://zenodo.org/api/records/21379215/files/0e65de5934db4f0eae02835ba7227dcc_normalized_optimized.glb/content'
          r=requests.get(url,timeout=(30,150));r.raise_for_status()
          assert len(r.content)==5603344
          assert hashlib.sha256(r.content).hexdigest()=='3fff5130cfad17cc1fcf312819019bad75782f4f01708d18696e100d643691cb'
          target.write_bytes(r.content)
          PY
          ./node_modules/.bin/gltf-transform copy "$D/donor_draco_adult.glb" "$D/donor_uncompressed_adult.glb"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('owl-pet/3d-experiments/172-tyto-castanops/run234-evidence/donor_uncompressed_adult.glb')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4865f48828adb93cef4f5ec07002adc1a61855a80adb286f781a227fca89430f'
          print('REAL ADULT GEOMETRY CHECKED',p.stat().st_size,flush=True)
          PY
      - name: Actually export two native textured GLB and render 14 true 3D camera directions
        run: |
          xvfb-run -a python -u owl-pet/3d-experiments/172-tyto-castanops/run234_real_CC0_donor_cream_texture_two_variants.py
          python - <<'PY'
          import pathlib,json,sys
          d=pathlib.Path('owl-pet/3d-experiments/172-tyto-castanops/run234-evidence')
          r=json.loads((d/'run234_machine_report.json').read_text())
          print(r['status'],flush=True)
          assert r['status']=='TWO_TRUE_NATIVE_GLB_14_REAL_3D_CAMERAS_MATERIAL_TEST_ART_REJECTED_NO_RELEASE'
          assert len(list(d.glob('run234_*_real_photogrammetry_ADULT_NOT_JUVENILE.glb')))==2
          PY
      - name: Archive native GLB, true 14-camera images, atlas and machine report; no deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run234-two-pbr-materials-14-actual-3d-views-ART_REJECTED-NO_RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run234-evidence
            owl-pet/3d-experiments/172-tyto-castanops/run234_real_CC0_donor_cream_texture_two_variants.py
          retention-days: 30
          if-no-files-found: warn
