name: "#172 Run232 CC0 animated owl native donor gate — NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run232-cc0-animated-owl-rig-lod-guest-access-no-release
    paths:
      - .github/workflows/owl172-run232-cc0-animated-owl-qa.yml
      - owl-pet/3d-experiments/172-tyto-castanops/run232_cc0_animated_owl_guest_native_qa.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  free-public-cc0-donor-experiment-no-release:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            owl-pet/design/concepts/172-tyto-castanops-v3.png
            owl-pet/3d-experiments/172-tyto-castanops/run232_cc0_animated_owl_guest_native_qa.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-extra-payment offscreen 3D inspection stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
          python -m pip install --quiet "numpy==1.26.4" "trimesh==4.4.9" "requests==2.32.3" "vtk==9.3.1" "pillow==10.4.0" "beautifulsoup4==4.12.3" "playwright==1.56.0"
          python -m playwright install chromium
      - name: Execute public guest-only asset acquisition, strict GLB and multi-view quality gates
        run: |
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run232_cc0_animated_owl_guest_native_qa.py
          xvfb-run -a python -u owl-pet/3d-experiments/172-tyto-castanops/run232_cc0_animated_owl_guest_native_qa.py
      - name: Commit actual machine report only in isolated research branch
        if: always()
        continue-on-error: true
        run: |
          D=owl-pet/3d-experiments/172-tyto-castanops/run232-evidence
          if test -s "$D/run232_machine_report.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --sparse -f "$D/run232_machine_report.json"
            git diff --cached --quiet || git commit -m "research(owl172): archive actual Run232 source probe and model QA — NO RELEASE"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Archive original native candidate and verification evidence, NOT RELEASE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run232-free-rig-donor-research-NO_RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run232-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run232_cc0_animated_owl_guest_native_qa.py
          retention-days: 30
          if-no-files-found: warn
