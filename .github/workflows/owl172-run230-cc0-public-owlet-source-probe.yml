name: "#172 Run230 free CC0 community juvenile native GLB qualification — NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run230-cc0-community-owlet-public-native-geometry-probe
    paths:
      - '.github/workflows/owl172-run230-cc0-public-owlet-source-probe.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run230_cc0_public_owlet_3d_probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  free-juvenile-asset-qa-no-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free CPU-only 3D import and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
          python -m pip install --quiet "numpy==1.26.4" "trimesh==4.4.9" "requests==2.32.3" "vtk==9.3.1" "pillow==10.4.0"
      - name: Validate executable syntax and concept integrity, probe only advertised public GLB links
        run: |
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run230_cc0_public_owlet_3d_probe.py
          xvfb-run -a python -u owl-pet/3d-experiments/172-tyto-castanops/run230_cc0_public_owlet_3d_probe.py
      - name: Persist actual JSON outcome on isolated research branch, never in main
        if: always()
        continue-on-error: true
        run: |
          D=owl-pet/3d-experiments/172-tyto-castanops/run230-evidence
          if test -s "$D/run230_machine_report.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$D/run230_machine_report.json"
            git diff --cached --quiet || git commit -m "research(owl172): archive Run230 actual public model access result (NO RELEASE)"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Archive raw evidence and any authentic 3D for independent review — never a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run230-native-asset-search-ART_UNAPPROVED-NO_RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run230-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run230_cc0_public_owlet_3d_probe.py
          retention-days: 30
          if-no-files-found: warn
