name: "#172 Run246 correct Y-up eucalypt horizontal true 3D ledge — RESEARCH NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run246-correct-y-up-eucalypt-horizontal-shelf-neural-3d-no-release
    paths:
      - '.github/workflows/owl172-run246-yup-horizontal-eucalypt-ledges-native-webgl.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  native-yup-ledge-ab-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free native SDF, mesh and WebGL2 QA tools
        run: |
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "scikit-image==0.25.2" "trimesh==4.9.0" "Pillow==10.4.0"
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run246_yup_horizontal_organic_eucalypt_ledge_ab.py
      - name: Download SHA-pinned true Hunyuan learned owl GLB from immutable prior artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p owl-pet/3d-experiments/172-tyto-castanops/run246-source
          gh run download 44725561312 -R janeytlin-eng/game-owl-ket -n owl172-run244-implicit-3D-EF-real-14view-RESEARCH-NO-RELEASE -D owl-pet/3d-experiments/172-tyto-castanops/run246-source
          echo '19274685ed19bb4c61b36a55b09048649a3db5c691aff2d75b1fe33831abf1ee  owl-pet/3d-experiments/172-tyto-castanops/run246-source/run244-evidence/run244_E_real_neural_implicit_clad_ART_UNAPPROVED_NO_RELEASE.glb' | sha256sum -c -
      - name: Build two real 3D horizontal ledges, preserve source neural owl; verify GLBs
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run246_yup_horizontal_organic_eucalypt_ledge_ab.py \
            --source owl-pet/3d-experiments/172-tyto-castanops/run246-source/run244-evidence/run244_E_real_neural_implicit_clad_ART_UNAPPROVED_NO_RELEASE.glb \
            --outdir owl-pet/3d-experiments/172-tyto-castanops/run246-evidence
      - name: Load both true GLBs into actual Chromium Three.js WebGL2 and capture 14 camera views
        run: |
          set -e
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run246-evidence
          for V in A B; do
            export OWL172_RUN_LABEL="Run246_YUP_horizontal_ledge_${V}_RESEARCH_ONLY"
            export OWL172_QA_DIR="$PWD/$EVID/browser_${V}"
            export OWL172_GLB_INPUT="$PWD/$EVID/run246_${V}_real_neural_owl_YUP_horizontal_ledge_RESEARCH_ART_UNAPPROVED.glb"
            export OWL172_EXPECTED_SHA="$(python -c "import json; j=json.load(open('$EVID/run246_machine_report.json')); print(next(v['sha256'] for v in j['tests'] if v['variant']=='${V}'))")"
            mkdir -p "$OWL172_QA_DIR"
            xvfb-run -a timeout 340s node owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs
          done
      - name: Verify browser screenshots and create one research-only A/B contact with no art approval
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageDraw
          base=Path("owl-pet/3d-experiments/172-tyto-castanops/run246-evidence")
          names=["front","left","threequarter","right","back","top","bottom"]
          columns=[]
          per={}
          for var in "AB":
            folder=base/("browser_"+var)
            report=folder/"run237_machine_report.json"
            data=json.loads(report.read_text()) if report.exists() else {}
            images=[]
            for name in names:
              file=folder/("run237_"+name+"_WEBGL_RESEARCH_NOT_APPROVED.png")
              expected=[x for x in data.get("views",[]) if x.get("name")==name]
              if file.exists() and len(expected)==1:
                assert hashlib.sha256(file.read_bytes()).hexdigest()==expected[0]["screenshot"]["sha256"]
                images.append((name,Image.open(file).convert("RGB")))
            per[var]={"browser_status":data.get("status","MISSING"),"views":len(images),
                      "actual_software_gpu":data.get("browser",{}).get("renderer",{}).get("gpu"),
                      "gates":data.get("gates",{})}
            columns.extend([(var,name,im) for name,im in images])
          if len(columns)==14:
            sheet=Image.new("RGB",(4*340,4*373),(234,237,241))
            draw=ImageDraw.Draw(sheet)
            for i,(var,name,im) in enumerate(columns):
              x=(i%4)*340;y=(i//4)*373
              sheet.paste(im.resize((330,330)),(x+4,y+32))
              draw.text((x+5,y+9),"Run246 "+var+" "+name+" REAL WEBGL2 RESEARCH",fill=(16,20,26))
            target=base/"run246_AB_fourteen_actual_WebGL2_views_ART_UNAPPROVED.png"
            sheet.save(target)
            per["contact_sha256"]=hashlib.sha256(target.read_bytes()).hexdigest()
          per["art_approved"]=False
          per["phone_gpu"]="UNTESTED"
          per["release"]="NO_RELEASE"
          (base/"run246_webgl_summary.json").write_text(json.dumps(per,indent=2)+"\n")
          print(json.dumps(per,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run246-YUP-true3d-horizontal-ledge-AB-fourteenview-RESEARCH-NO-RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run246-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run246_yup_horizontal_organic_eucalypt_ledge_ab.py
          retention-days: 30
          if-no-files-found: warn
      - name: Commit ONLY machine reports and visual art-QA evidence to isolated branch
        if: always()
        run: |
          git config user.name owl172-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run246-evidence
          git add -f "$EVID"/*.json 2>/dev/null || true
          git add -f "$EVID"/run246_AB_fourteen_actual_WebGL2_views_ART_UNAPPROVED.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'audit(owl172): Run246 Y-up ledge variants machine and browser evidence NO RELEASE'
            git pull --rebase origin research/owl172-run246-correct-y-up-eucalypt-horizontal-shelf-neural-3d-no-release
            git push origin HEAD:research/owl172-run246-correct-y-up-eucalypt-horizontal-shelf-neural-3d-no-release
          fi
