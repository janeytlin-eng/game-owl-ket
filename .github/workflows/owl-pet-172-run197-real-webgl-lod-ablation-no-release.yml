name: owl172 Run197 real skinning LOD switch and WebGL ablation NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run197-webgl-rig-lod-ablation-no-release
    paths:
      - .github/workflows/owl-pet-172-run197-real-webgl-lod-ablation-no-release.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run197_threejs_lod_animation_ablation.py
permissions:
  contents: write
  actions: read
jobs:
  run197-real-high-low-lod-browser-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run197-webgl-rig-lod-ablation-no-release
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/README.md
            owl-pet/AGENTS.md
            owl-pet/prototype/index.html
            owl-pet/research/species/172-tyto-castanops-v3.md
            owl-pet/3d-experiments/172-tyto-castanops/known_rejected_asset_sha256_registry.json
            owl-pet/3d-experiments/172-tyto-castanops/2026-11-19-run195-real-free-cc0-rigged-owl-native-sevenview-ART_REJECTED-NO_RELEASE.md
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png
            owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run196-REAL-WEBGL-RIG-ART_REJECTED-NO_RELEASE/run196_result.json
            owl-pet/3d-experiments/172-tyto-castanops/tools/run196_real_threejs_mobile_emulation_skinning.py
            owl-pet/3d-experiments/172-tyto-castanops/tools/run197_threejs_lod_animation_ablation.py
      - uses: actions/download-artifact@v4
        with:
          name: owl172-run195-free-CC0-native-rig-donor-NO_RELEASE
          repository: janeytlin-eng/game-owl-ket
          run-id: 44383285372
          github-token: ${{ github.token }}
          path: /tmp/run197-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact approved source identity, previous actual WebGL baseline and all scope boundaries
        shell: bash
        run: |
          set -euo pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run197-WEBGL-LOD-RIG-ART_REJECTED-NO_RELEASE"
          mkdir -p "$O"
          sha256sum /tmp/run197-source/run195_OWL_0.glb | tee "$O/exact_donor_sha256.txt"
          grep -q '^a22017221687458f37b76991719cb80243b5f04554ae57f07503139f988add3f ' "$O/exact_donor_sha256.txt"
          sha256sum "$R/research-evidence-run114C-RGB-BOUNDED-NATIVE-ART_REJECTED/rightmost_mesoptile_input.png" | tee "$O/exact_reference_sha256.txt"
          grep -q '^5a52dfcb228a5048a66679d0d09c1b48e191d54cebbd9291bf99b18df03155d9 ' "$O/exact_reference_sha256.txt"
          test -s "$R/research-evidence-run196-REAL-WEBGL-RIG-ART_REJECTED-NO_RELEASE/run196_result.json"
          test -s "$R/known_rejected_asset_sha256_registry.json"
          test -s "$R/2026-11-19-run195-real-free-cc0-rigged-owl-native-sevenview-ART_REJECTED-NO_RELEASE.md"
          python -m py_compile "$R/tools/run196_real_threejs_mobile_emulation_skinning.py" "$R/tools/run197_threejs_lod_animation_ablation.py"
      - name: Install pinned Three.js, Chromium and Mesa entirely without paid external services
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run197-WEBGL-LOD-RIG-ART_REJECTED-NO_RELEASE
          sudo apt-get update -qq > "$O/apt_update.log" 2>&1
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 > "$O/apt_mesa.log" 2>&1
          python -m pip install -q playwright==1.56.0 > "$O/pip_install.log" 2>&1
          python -m playwright install chromium > "$O/chromium_install.log" 2>&1
          npm install --no-audit --no-fund --prefix /tmp/owl197-js three@0.181.2 > "$O/npm_three_install.log" 2>&1
          node -p "require('/tmp/owl197-js/node_modules/three/package.json').version" > "$O/three_version.txt"
      - name: Render and sample the real skinned LOW and HIGH LOD variants in independent browser contexts
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail
          R=owl-pet/3d-experiments/172-tyto-castanops
          O="$R/research-evidence-run197-WEBGL-LOD-RIG-ART_REJECTED-NO_RELEASE"
          timeout 275s python -u "$R/tools/run197_threejs_lod_animation_ablation.py" \
            --input /tmp/run197-source/run195_OWL_0.glb \
            --modules /tmp/owl197-js/node_modules \
            --out "$O" 2>&1 | tee "$O/actual_lod_ablation_console.log"
      - name: Cryptographic archive integrity and NO_RELEASE even on partial failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          o=Path('owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run197-WEBGL-LOD-RIG-ART_REJECTED-NO_RELEASE')
          o.mkdir(parents=True,exist_ok=True)
          (o/'NO_RELEASE.flag').write_text('Technical LOD proof ONLY; rejected art; no physical mobile phone test; no release\n')
          p=o/'run197_summary.json'
          if p.is_file():
            d=json.loads(p.read_text())
            print('FINAL_ABLATION',d.get('status'),'TESTS_PASS',d.get('all_tests_pass'))
          else:(o/'NO_RESULT.txt').write_text('No machine result: inspect failure log. NO_RELEASE\n')
          files={str(p.relative_to(o)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(o.rglob('*')) if p.is_file() and p.name!='run197_sha256_manifest.json'}
          (o/'run197_sha256_manifest.json').write_text(json.dumps(files,indent=2)+'\n')
          assert all(hashlib.sha256((o/name).read_bytes()).hexdigest()==item['sha256'] for name,item in files.items())
          print('EVIDENCE_FILES',len(files),'LOW_SHOTS',len(list((o/'low').glob('*.png'))),'HIGH_SHOTS',len(list((o/'high').glob('*.png'))))
          PY
      - name: Archive real source-derived high/low screenshot files privately in quarantined artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run197-real-webgl-rig-lod-ablation-ART_REJECTED-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run197-WEBGL-LOD-RIG-ART_REJECTED-NO_RELEASE/
          retention-days: 30
      - name: Commit only immutable metrics and logs, no rejected screenshots, model or deploy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run197-WEBGL-LOD-RIG-ART_REJECTED-NO_RELEASE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find "$O" -type f \( -name '*.json' -o -name '*.txt' -o -name '*.log' -o -name '*.flag' \) -print0 | xargs -0 -r git add --sparse --
          git diff --cached --name-only > /tmp/owl197_changed
          if grep -Ev '^owl-pet/3d-experiments/172-tyto-castanops/' /tmp/owl197_changed; then exit 80; fi
          if grep -Ei '\.(png|jpg|glb|blend|zip|fbx|obj|html)$' /tmp/owl197_changed; then exit 81; fi
          if test -s /tmp/owl197_changed; then
            git commit -m 'research(owl172): archive Run197 actual GLB rig WebGL LOD comparison NO_RELEASE'
            git push origin HEAD:research/owl172-run197-webgl-rig-lod-ablation-no-release
          fi
