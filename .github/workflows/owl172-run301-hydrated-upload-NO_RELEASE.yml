name: "owl172 Run301 hydrated upload real textured GLB research NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run301-hydrated-upload-diagnostic-NO_RELEASE
    paths:
      - '.github/workflows/owl172-run301-hydrated-upload-NO_RELEASE.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run301_hydrated_textured_provider_NO_RELEASE.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero_paid_hydration_upload_native3d_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/design/concepts/172-tyto-castanops-v3.png
            owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py
            owl-pet/3d-experiments/172-tyto-castanops/run301_hydrated_textured_provider_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs
            owl-pet/3d-experiments/172-tyto-castanops/run292_browser_viewer_uncropped_NO_RELEASE.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct original v3 mesoptile exact RGB and verify source SHA
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy opencv-python-headless trimesh
          python owl-pet/3d-experiments/172-tyto-castanops/run295_real_reference_cutout_preprocess_ONLY_NO_RELEASE.py | tee run301-original-source.txt
          cp owl172-run295-evidence/young-isolated-white-background-input-NO_3D.png target-owl172-isolated-WHITE.png
          test "$(sha256sum target-owl172-isolated-WHITE.png | cut -d' ' -f1)" = 6ec346e5b02411f9509fd364db748c23a58075aeec461ef7424adcc4d893bc77
          mkdir -p owl172-run301-evidence/reference
          cp owl172-run295-evidence/young-isolated-white-background-input-NO_3D.png owl172-run301-evidence/reference/
          cp owl172-run295-evidence/run295_matte_QA.json owl172-run301-evidence/reference/
      - name: Real browser hydration diagnostic and one normal free textured 3D attempt
        timeout-minutes: 12
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright-core@1.58.2 three@0.170.0
          node --check owl-pet/3d-experiments/172-tyto-castanops/run301_hydrated_textured_provider_NO_RELEASE.mjs
          node owl-pet/3d-experiments/172-tyto-castanops/run301_hydrated_textured_provider_NO_RELEASE.mjs | tee owl172-run301-evidence/browser-stdout.txt
      - name: Independent native GLB inspect and genuine Chromium multi-angle only if model exists
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          mkdir -p owl172-run301-evidence
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import trimesh
          o=Path('owl172-run301-evidence')
          f=o/'run301-real-generated-NOT_APPROVED.glb'
          r={'native_exists':f.exists(),'art_approved':False,'rights_cleared':False,'physical_phone_tested':False,'release_allowed':False}
          if f.exists():
              try:
                  s=trimesh.load(f,force='scene')
                  m=list(s.geometry.values())
                  r.update(bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest(),
                           triangle_count=sum(len(x.faces) for x in m),
                           geometries=len(m),texture_kinds=[x.visual.kind for x in m])
                  assert r['triangle_count']>1000
              except Exception as e: r['native_inspection_error']=str(e)
          (o/'independent-native-gate.json').write_text(json.dumps(r,indent=2))
          print(r)
          PY
          test -f owl172-run301-evidence/run301-real-generated-NOT_APPROVED.glb || exit 0
          node owl-pet/3d-experiments/172-tyto-castanops/run292_real_browser_glb_test_NO_RELEASE.mjs owl172-run301-evidence/run301-real-generated-NOT_APPROVED.glb >owl172-run301-evidence/webgl2-three-views-log.txt 2>&1 || echo WEBGL2_NOT_PASSED >owl172-run301-evidence/WEBGL2_HOLD.flag
          test ! -d owl172-run292-browser-evidence || cp -r owl172-run292-browser-evidence owl172-run301-evidence/browser_views
      - name: Always preserve evidence SHA and independent NO RELEASE verdict
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('owl172-run301-evidence');p.mkdir(exist_ok=True)
          native=p/'run301-real-generated-NOT_APPROVED.glb'
          (p/'STRICT_NO_RELEASE.json').write_text(json.dumps({
            'model_exists':native.exists(),'human_art_pass':False,
            'rights_cleared':False,'physical_phone_tested':False,
            'release_allowed':False,'external_payment_usd':0,'final':'NO_RELEASE'},indent=2))
          sums=[]
          for f in sorted(p.rglob('*')):
              if f.is_file() and f.name!='SHA256SUMS.txt':
                  sums.append(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(p)))
          (p/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          print('Evidence files:',len(sums),'Native GLB:',native.exists())
          PY
          (cd owl172-run301-evidence && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run301-hydrated-real-native-3d-RESEARCH-NO_RELEASE
          path: owl172-run301-evidence/
          retention-days: 14
          if-no-files-found: warn
