name: Owl172 Run323c exact CC0 owl GLB WebGL2 QA NO_RELEASE
on:
  push:
    branches:
      - research/owl172-run323-juvenile-native-free-rig-source-access-NO_RELEASE
    paths:
      - '.github/workflows/owl172-run323c-owl-webgl-replay-NO_RELEASE.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run323c_replay_owl_glb_webgl2_NO_RELEASE.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-owl-glb-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Acquire already verified genuine GLB from preceding real free source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run323-input
          gh run download 45180513360 --repo janeytlin-eng/game-owl-ket \
            --name run323-juvenile-source-real-browser-NO_RELEASE \
            --dir run323-input
          test -s run323-input/source_animal_owl.glb
      - name: Free Chromium and Three.js dependencies
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund three@0.170.0
      - name: Native owl model actual 390x780 WebGL2 front right rear
        run: |
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run323c_replay_owl_glb_webgl2_NO_RELEASE.py
          python owl-pet/3d-experiments/172-tyto-castanops/run323c_replay_owl_glb_webgl2_NO_RELEASE.py
      - name: Research archive hash inventory and NO_RELEASE warning
        if: always()
        run: |
          mkdir -p run323-output
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('run323-output')
          rows={}
          for f in sorted(p.iterdir()):
              if f.is_file() and f.name!='SHA256-MANIFEST.json':
                  rows[f.name]={'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}
          (p/'SHA256-MANIFEST.json').write_text(json.dumps(rows,indent=2))
          (p/'NO_RELEASE.txt').write_text('ART_REJECTED / NO_RELEASE: blocky toy not Tyto castanops mesoptile, not phone-tested.\n')
          print('archived',len(rows),'files;',len([x for x in rows if x.startswith('webgl-')]),'live owl WebGL captures')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run323c-true-owl-WebGL2-threeviews-ART_REJECTED
          path: run323-output/
          retention-days: 14
