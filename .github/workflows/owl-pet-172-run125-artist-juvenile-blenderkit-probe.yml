name: owl172 Run125 actual independent free sculpt source and license gate
on:
  push:
    branches:
      - research/owl172-run125-juvenile-artist-source-blenderkit-blendswap
    paths:
      - .github/workflows/owl-pet-172-run125-artist-juvenile-blenderkit-probe.yml
      - owl-pet/3d-experiments/172-tyto-castanops/tools/run125_independent_chick_source_access.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-public-source-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/owl172-run125-juvenile-artist-source-blenderkit-blendswap
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            owl-pet/3d-experiments/172-tyto-castanops/tools/run125_independent_chick_source_access.py
            .github/workflows/owl-pet-172-run125-artist-juvenile-blenderkit-probe.yml
      - name: Actual public HTTP access and magic-byte/rights classification, no authentication/payment
        id: probe
        timeout-minutes: 7
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT=owl-pet/3d-experiments/172-tyto-castanops
          OUT="$ROOT/research-evidence-run125-JUVENILE-ARTIST-SOURCE-NO_RELEASE"
          mkdir -p "$OUT"
          python3 "$ROOT/tools/run125_independent_chick_source_access.py" "$OUT" 2>&1 | tee "$OUT/run125_real_http.log"
      - name: Archive failure evidence and SHA256 proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run125-JUVENILE-ARTIST-SOURCE-NO_RELEASE
          mkdir -p "$OUT"
          printf 'probe_step=%s\n' "${{ steps.probe.outcome }}" > "$OUT/steps.txt"
          test -e "$OUT/NO_RELEASE.flag" || echo 'ART_UNREVIEWED NO_RELEASE: source inspection incomplete.' > "$OUT/NO_RELEASE.flag"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt ! -name sha_checked.log -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt > sha_checked.log)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run125-real-independent-sculpt-source-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run125-JUVENILE-ARTIST-SOURCE-NO_RELEASE
          retention-days: 30
      - name: Preserve only new isolated #172 audit, never deploy or touch 251-species production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT=owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run125-JUVENILE-ARTIST-SOURCE-NO_RELEASE
          git add --sparse "$OUT"
          git diff --cached --name-only > /tmp/owl172-run125-files.txt
          if grep -v '^owl-pet/3d-experiments/172-tyto-castanops/research-evidence-run125-' /tmp/owl172-run125-files.txt; then
            echo 'UNEXPECTED PATH: stop without commit'; exit 8
          fi
          if ! git diff --cached --quiet; then
            git commit -m "research(owl172): archive Run125 real zero-cost chick source/rights NO_RELEASE"
            git push origin HEAD:research/owl172-run125-juvenile-artist-source-blenderkit-blendswap
          fi
