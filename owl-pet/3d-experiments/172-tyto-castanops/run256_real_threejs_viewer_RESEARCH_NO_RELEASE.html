<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Run256 REAL native GLB browser art research; NO RELEASE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9ebec}
#stage{display:block;width:640px;height:640px}
</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="stage" width="640" height="640"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.__qa={status:"loading",view:null};
const canvas=document.getElementById('stage');
try {
  const gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
  if(!gl) throw Error("WebGL2 unavailable");
  const renderer=new THREE.WebGLRenderer({canvas,context:gl,antialias:true,alpha:false});
  renderer.setSize(640,640,false);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.22;
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xe8e9ed);
  scene.add(new THREE.HemisphereLight(0xffffff,0x88818a,2.5));
  const key=new THREE.DirectionalLight(0xfff2dc,3.1);key.position.set(3,5,7);scene.add(key);
  const fill=new THREE.DirectionalLight(0xe8edff,1.7);fill.position.set(-4,1,-5);scene.add(fill);
  const {scene:obj}=await new GLTFLoader().loadAsync('/model.glb');
  scene.add(obj);
  let meshCount=0,triangles=0,missingNormals=0,materials=0,textured=0;
  obj.traverse(node=>{
    if(!node.isMesh) return;
    meshCount++;
    const geo=node.geometry;
    triangles+=(geo.index?geo.index.count:geo.attributes.position.count)/3;
    if(!geo.attributes.normal)missingNormals++;
    const mats=Array.isArray(node.material)?node.material:[node.material];
    for(const m of mats){materials++;if(m.map)textured++}
  });
  const bbox=new THREE.Box3().setFromObject(obj);
  const center=bbox.getCenter(new THREE.Vector3());
  const size=bbox.getSize(new THREE.Vector3());
  const extent=Math.max(size.x,size.y,size.z,0.01);
  const radius=extent*0.67;
  const camera=new THREE.OrthographicCamera(-radius,radius,radius,-radius,0.01,extent*14);
  const vectors={
    front:[0,0,1], left:[-1,0,0], threequarter:[1,0.3,1.4],
    right:[1,0,0], back:[0,0,-1], top:[0.05,1,0.05], bottom:[0.05,-1,0.05]
  };
  const render=name=>{
    const dir=new THREE.Vector3(...vectors[name]).normalize();
    camera.position.copy(center).addScaledVector(dir,extent*2.6);
    camera.lookAt(center);
    camera.up.set(0,1,0);
    if(name==='top'||name==='bottom')camera.up.set(0,0,-1);
    camera.lookAt(center);
    camera.updateProjectionMatrix();
    renderer.render(scene,camera);
    return {name,camera:camera.position.toArray(),center:center.toArray()};
  };
  window.__qa={
    status:'ready',
    stats:{
      source:"actual Three.js GLTFLoader (real 3D)",meshCount,triangles,
      missingNormals,materials,textured,
      bounds:bbox.min.toArray().concat(bbox.max.toArray()),
      renderer:renderer.getContext().getParameter(renderer.getContext().RENDERER),
      unmaskedRenderer:renderer.getContext().getExtension("WEBGL_debug_renderer_info")
        ?renderer.getContext().getParameter(renderer.getContext()
          .getExtension("WEBGL_debug_renderer_info").UNMASKED_RENDERER_WEBGL):null,
      isWebGL2:renderer.capabilities.isWebGL2,
      size:size.toArray()
    },
    setView:render
  };
  render('front');
} catch(error) {
  window.__qa={status:'error',error:String(error?.stack||error)};
  console.error(error);
}
</script>
</body>
</html>
