name: '#172 Run217 zero-charge GroomLab native-groom tool qualification'
on:
  push:
    branches:
      - research/owl172-run217-free-groomlab-native-tool-qualification-no-release
    paths:
      - '.github/workflows/owl172-run217-groomlab-native-free-tool-qa.yml'
      - 'owl-pet/3d-experiments/172-tyto-castanops/run217_free_groomlab_cli_probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-native-groom-tool-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install only free native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build libtbb-dev build-essential
      - name: Execute actual isolated GroomLab CLI clone configure build and inspection
        run: python3 owl-pet/3d-experiments/172-tyto-castanops/run217_free_groomlab_cli_probe.py
      - name: Archive exact diagnostics irrespective of success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl172-run217-free-groomlab-qualification-NO_RELEASE
          path: owl-pet/3d-experiments/172-tyto-castanops/run217-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist only diagnostic text to isolated research branch
        if: always()
        shell: bash
        env:
          GH_RESEARCH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'owl172-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owl-pet/3d-experiments/172-tyto-castanops/run217-evidence/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'research(#172): record Run217 actual native groom trial and failures'
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_RESEARCH_TOKEN" | base64 -w0)" push origin HEAD:research/owl172-run217-free-groomlab-native-tool-qualification-no-release || echo 'PUSH_FAILED; raw artifact remains independent proof'
          fi
