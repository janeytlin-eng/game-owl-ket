name: "#172 Run250 true neural volumetric mesoptile resculpt + LOD — research NO RELEASE"
on:
  push:
    branches:
      - research/owl172-run250-volumetric-mesoptile-retopology-LOD-no-release
    paths:
      - '.github/workflows/owl172-run250-volumetric-mesoptile-LOD-webgl.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  genuine-volumetric-3d-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FREE real volumetric 3D and browser QA tools
        run: |
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" "scikit-image==0.26.0" "trimesh==4.11.1" "Pillow==12.3.0" "vtk==9.6.2"
          npm install --no-save --no-package-lock three@0.181.2 playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run250_native_mesoptile_reconstruction.py
          python -m py_compile owl-pet/3d-experiments/172-tyto-castanops/run250_neural_color_transfer.py
      - name: Retrieve SHA-verified real neural Run248 Hunyuan sculpt (not an image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=owl-pet/3d-experiments/172-tyto-castanops/run248-source
          mkdir -p "$SRC"
          gh run download 44763474018 -R janeytlin-eng/game-owl-ket -n owl172-run248-true-neural-anatomy-AB-fourteenview-RESEARCH-NO-RELEASE -D "$SRC"
          echo '247d820538920735783072a204686fcf2f02ddb3ce1958a5472895a3ed7c1845  owl-pet/3d-experiments/172-tyto-castanops/run248-source/run248-evidence/run248_A_true_neural_juvenile_selective_wing_sculpt_RESEARCH_NO_RELEASE.glb' | sha256sum -c -
      - name: Actually rebuild two DIFFERENT true volumetric native GLBs, remesh and reimport
        run: |
          python owl-pet/3d-experiments/172-tyto-castanops/run250_native_mesoptile_reconstruction.py \
            --source owl-pet/3d-experiments/172-tyto-castanops/run248-source/run248-evidence/run248_A_true_neural_juvenile_selective_wing_sculpt_RESEARCH_NO_RELEASE.glb \
            --outdir owl-pet/3d-experiments/172-tyto-castanops/run250-evidence
      - name: Actual Three.js Chromium native WebGL2 loading and seven REAL cameras per model
        run: |
          set -e
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run250-evidence
          for V in A B; do
            export OWL172_RUN_LABEL="Run250_$V_GENUINE_NEURAL_VOLUME_LOD_RESEARCH_ONLY"
            export OWL172_QA_DIR="$PWD/$EVID/browser_$V"
            export OWL172_GLB_INPUT="$PWD/$EVID/run250_$V""_native_neural_volumetric_juvenile_rebuild_LOD_RESEARCH_NO_RELEASE.glb"
            export OWL172_EXPECTED_SHA="$(python -c "import json; r=json.load(open('$EVID/run250_machine_report.json'));print(r['variants']['$V']['glb_sha256'])")"
            mkdir -p "$OWL172_QA_DIR"
            xvfb-run -a timeout 340s node owl-pet/3d-experiments/172-tyto-castanops/run237_real_browser_webgl_smoke.mjs
          done
      - name: Hash-check original WebGL screenshots; create 14-view ART-REJECTED proof
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import hashlib,json
          root=Path('owl-pet/3d-experiments/172-tyto-castanops/run250-evidence')
          cameras=['front','left','threequarter','right','back','top','bottom']
          summary={'run':'Run250','art_approved':False,'phone_gpu':'UNTESTED','release':'NO_RELEASE','variants':{}}
          entries=[]
          for v in 'AB':
            folder=root/('browser_'+v)
            p=folder/'run237_machine_report.json'
            if not p.exists():
              summary['variants'][v]={'status':'MISSING_REPORT'}
              continue
            r=json.loads(p.read_text())
            summary['variants'][v]={'status':r.get('status'),'gates':r.get('gates'),'driver':r.get('browser',{}).get('renderer',{}),
                                    'native_model':r.get('browser',{}).get('model',{})}
            for name in cameras:
              f=folder/('run237_'+name+'_WEBGL_RESEARCH_NOT_APPROVED.png')
              matches=[m for m in r.get('views',[]) if m.get('name')==name]
              assert f.exists() and len(matches)==1,('missing real camera',v,name)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==matches[0]['screenshot']['sha256']
              entries.append((v,name,Image.open(f).convert('RGB')))
          if len(entries)==14:
            sheet=Image.new('RGB',(1380,1480),(232,236,240))
            d=ImageDraw.Draw(sheet)
            for i,(v,name,img) in enumerate(entries):
              x=(i%4)*345
              y=(i//4)*370
              sheet.paste(img.resize((337,337)),(x+3,y+29))
              d.text((x+5,y+8),'Run250 '+v+' '+name+' RESEARCH NO_RELEASE',fill=(16,16,16))
            p=root/'run250_AB_14_actual_WebGL2_views_ART_REJECTED_NO_RELEASE.png'
            sheet.save(p)
            summary['contact_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'run250_webgl_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl172-run250-true-neural-volume-LOD-fourteenviews-RESEARCH-NO-RELEASE
          path: |
            owl-pet/3d-experiments/172-tyto-castanops/run250-evidence/
            owl-pet/3d-experiments/172-tyto-castanops/run250_native_mesoptile_reconstruction.py
            owl-pet/3d-experiments/172-tyto-castanops/run250_neural_color_transfer.py
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve only scoped study reports and 14 REAL viewpoint picture
        if: always()
        run: |
          git config user.name owl172-research-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          EVID=owl-pet/3d-experiments/172-tyto-castanops/run250-evidence
          git add -f "$EVID"/*.json 2>/dev/null || true
          git add -f "$EVID"/run250_AB_14_actual_WebGL2_views_ART_REJECTED_NO_RELEASE.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "audit(owl172): Run250 true volume neural 3D retopo, mobile LOD, fourteen-view QA NO_RELEASE"
            git pull --rebase origin research/owl172-run250-volumetric-mesoptile-retopology-LOD-no-release
            git push origin HEAD:research/owl172-run250-volumetric-mesoptile-retopology-LOD-no-release
          fi

# Corrective COLOR_0 transfer: native original neural surface RGB must survive retopology. No art approval.
